  description: Every entity carries `entityId`, the platform-native identifier, and it is the input to the corresponding detail endpoint. A video with entityId 7403212 in a list resolves at GET /v1/tiktok/videos/7403212. The same holds for comments, collections, audio tracks, subreddits and posts.
