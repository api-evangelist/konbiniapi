  - id (AS 2.0 IRI)
  - url (canonical platform URL)
  - preferredUsername (accounts)
  - slug (subreddits)
  id_prefixes: null
  id_prefix_note: No opaque prefixed IDs. KonbiniAPI passes through the upstream platform identifier verbatim.
