cross_platform_pattern:
  note: The same five shapes recur under every platform prefix. An integrator writing against one platform can reuse the traversal for the others by swapping the prefix.
  recurring_shapes:
  - role: account
    as2_type: Person
    instances:
    - InstagramEmbeddedUser
    - TikTokEmbeddedUser
    - RedditEmbeddedUser
    - RedditUser
    - XEmbeddedUser
  - role: image
    as2_type: Image
    instances:
    - InstagramImage
    - InstagramImageWithDimensions
    - TikTokImage
    - RedditImage
    - XImage
    - LinkedInImage
  - role: link
    as2_type: Link
    instances:
    - InstagramLink
    - TikTokLink
    - XLink
  - role: tag
    as2_type: Tag
    instances:
    - InstagramTag
    - TikTokTag
    - RedditTag
    - XTag
  - role: primary content
    as2_type: Video|Note
    instances:
    - InstagramPost
    - TikTokVideo
    - RedditPost
    - XPost
    - LinkedInRecentPost
    - LinkedInCompanyPost
  - role: comment
    as2_type: Note
    instances:
    - InstagramComment
    - TikTokComment
    - RedditComment
    - LinkedInComment
traversals:
- name: account to content to comments to replies
  path:
  - '{platform}_get_user'
  - '{platform}_get_user_posts|videos'
  - '{platform}_get_post|video_comments'
  - '{platform}_get_comment_replies'
  key: entityId carries forward at every hop
  available_on:
  - TikTok
  - Reddit
  partial_on:
  - Instagram (no comment-reply endpoint)
  - X (no comments endpoint)
  - LinkedIn (comments inline on the post, max ~5)
- name: audio to videos using it
  path:
  - tiktok_get_audio
  - tiktok_get_audio_videos
  available_on:
  - TikTok
- name: subreddit to posts to comments
  path:
  - reddit_get_subreddit
  - reddit_get_subreddit_posts
  - reddit_get_post_comments
  - reddit_get_comment_replies
  available_on:
  - Reddit
- name: community to posts and media
  path:
  - x_get_community
  - x_get_community_posts
  - x_get_community_media
  available_on:
  - X
- name: company to posts
  path:
  - linkedin_get_company
  - linkedin_get_company_posts
  available_on:
  - LinkedIn
renders:
  json_schema: json-schema/
  json_structure: json-structure/
  examples: examples/
  json_ld: json-ld/
