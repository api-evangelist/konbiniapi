note: 'Entity-relationship graph derived from the 58 named component schemas and their $ref edges in the live OpenAPI. KonbiniAPI''s design premise is that the same ActivityStreams 2.0 type system repeats per platform: each of the five platforms gets its own namespaced copy of the same handful of shapes (embedded user, image, link, tag, post/video, comment, attachment). The AS 2.0 `type` value is what makes them interchangeable across platforms, not a shared schema — there is no single Person or Note component, there are five of each.'
