feature_parity:
  note: >-
    Unusually flat. Every plan — including Free — carries the full endpoint surface, all five
    platforms, both the REST API and MCP, real-time data and no rate limits. The only variables are
    credit allowance, support tier, and whether extra usage may be enabled. There is no feature
    gating and no enterprise-only endpoint.

faq_facts:
  - question: What happens when credits run out?
    answer: >-
      Requests stop and return HTTP 402 by default — no automatic upgrades or charges on any plan.
      Paid plans may opt into extra usage instead.
  - question: Am I charged for failed requests?
    answer: No. Failed or timed-out requests do not consume credits.
  - question: How are batch endpoints billed?
    answer: Each item bills as its own request — 10 IDs in one batch call costs 10 credits.
  - question: Are there rate limits?
    answer: No rate limits, no throttling, no daily caps. The credit balance is the only ceiling.
