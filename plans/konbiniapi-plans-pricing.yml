provider:
  id: konbiniapi
  name: KonbiniAPI
  url: https://konbiniapi.com/
  pricingUrl: https://konbiniapi.com/pricing
  termsUrl: https://konbiniapi.com/terms
  dpaUrl: https://konbiniapi.com/dpa
  signupUrl: https://app.konbiniapi.com

unit:
  id: credit
  description: >-
    One credit equals one successful API request, with no multipliers. Requests that fail with 400,
    5xx or an upstream 502 are auto-refunded (X-Credits-Used: 0). A 404 IS charged. Batch endpoints
    bill 1 credit per ID submitted, so a 10-ID batch call costs 10 credits.
  applies_to:
    - REST API
    - MCP server
  note: A REST call and the equivalent MCP tool call cost exactly the same.

billing:
  currency: USD
  cycle: monthly
  rollover: false
  overage: optional
  overageDetail: >-
    Paid plans may opt into extra usage beyond the monthly credit allowance, billed at the same
    per-credit rate as the plan, capped by a monthly limit the customer sets (up to the plan's own
    price), and charged at the end of the billing cycle. Off by default — the default behaviour on
    every plan is to hard-stop with HTTP 402.
  exhaustionBehavior: 'Returns HTTP 402 with error code credits_exhausted; no automatic charges unless extra usage is enabled.'
  paymentProvider: Stripe
  paymentMethods:
    - credit card
    - debit card
    - Apple Pay
    - Google Pay
  taxes: Prices exclude applicable taxes.

