    Public pricing and metering re-read from konbiniapi.com/pricing and
    docs.konbiniapi.com/getting-started/credits on 2026-08-13. Custom tier values omitted
    (negotiated). Three corrections against the 2026-05-06 capture: the Free tier was missing,
    overage is now optional rather than none, and the refund table wrongly implied a 404 is free.
