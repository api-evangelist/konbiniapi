image: https://konbiniapi.com/konbini-logo.svg
description: >-
  KonbiniAPI is the social data layer for Instagram, TikTok, X, Reddit and LinkedIn, normalizing
  real-time public profile, post, video, comment, audio, community, subreddit, location and search
  data into a single consistent ActivityStreams 2.0 (W3C) shape. Sixty-seven endpoints are exposed
  through one Bearer-authenticated REST API and, one-for-one, through a hosted remote MCP (Model
  Context Protocol) server at mcp.konbiniapi.com with OAuth 2.1, so developers, AI agents and
  automation platforms can fetch normalized social data without managing platform-specific JSON
  quirks, TLS fingerprinting, sessions or pagination internals. Billing is a flat credit model — one
  successful request costs one credit, failed and upstream-error requests are refunded, and the
  provider publishes no rate limits at all.
