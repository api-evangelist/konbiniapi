- aid: konbiniapi:konbiniapi-mcp
  name: KonbiniAPI MCP Server
  description: >-
    Hosted remote MCP server exposing one typed tool for every one of the 67 REST operations, over
    streamable HTTP with OAuth 2.1 (authorization code + PKCE) or a Bearer API key. Adds three
    MCP-only projection inputs — projection_preset, data_fields and item_fields — that trim the
    response payload to cut agent token cost, with no REST equivalent. A tool call costs the same
    single credit as the equivalent REST call.
  humanURL: https://docs.konbiniapi.com/reference/mcp/overview
  baseURL: https://mcp.konbiniapi.com
