note: >-
  KonbiniAPI ships NO client libraries. This is a measured zero, not an unchecked field.
finding: >-
  The provider's position is that the SDK layer is unnecessary: the REST API is a plain Bearer-token
  GET surface with one normalized response shape, and for agents there is a hosted MCP server that
  removes the integration code entirely. That is a defensible design choice for a read-only data API,
  and it is consistent — the docs contain no install instructions of any kind. It does mean there is
  no first-party pinned artifact for a consumer to depend on, and therefore none of the release-decay
  signal a dated SDK would provide.
