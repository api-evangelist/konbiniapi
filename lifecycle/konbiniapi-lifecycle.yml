      source: https://konbiniapi.com/.well-known/security.txt
  tiers:
    free: best effort
    plus: standard
    pro: standard
    max: priority
    ultra: priority

stability_signals:
  releases: 6
  breaking_changes: 0
  additive_releases: 6
  operations_at_1_0_0: 30
  operations_at_1_5_0: 67
  platforms_at_1_0_0: 2
  platforms_at_1_5_0: 5
  first_release: '2026-03'
  latest_release: '2026-08'
  note: >-
    A young API — five months old — but shipping monthly and never breaking. The upstream risk is
    structural rather than contractual: the data comes from five social platforms KonbiniAPI does not
    control, and the docs already record platform-imposed page-size ceilings and non-chronological
    feeds as behaviour the provider cannot change.

