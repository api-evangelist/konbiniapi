  /v1/instagram/posts/{postId}:
    get:
      operationId: instagramGetPost
      tags:
      - Instagram
      summary: Get post details
      description: Returns details for a single post by its shortcode, including media, captions, and engagement counts. Supports photos, videos, and carousels.
      parameters:
      - schema:
          type: string
          description: Post shortcode (from instagram.com/p/{shortcode}/)
          example: DekIIwwgb2h
        required: true
        description: Post shortcode (from instagram.com/p/{shortcode}/)
        name: postId
        in: path
      responses:
        '200':
          description: Returns the Instagram post
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      type:
                        type: string
                        description: ActivityStreams object type
                        example: Video
                      id:
                        type: string
                        format: uri
                        description: Post permalink
                        example: https://www.instagram.com/p/DekIIwwgb2h/
                      url:
                        type: string
                        format: uri
                        description: Post URL
                        example: https://www.instagram.com/p/DekIIwwgb2h/
                      entityId:
                        type: string
                        description: Post shortcode (used as lookup key)
                        example: DekIIwwgb2h
                      content:
                        type: string
                        example: '@WHOOP, now available in Arabic


                          ووب الآن بالعربية'
                        description: Caption or description
                      published:
                        type: string
                        format: date-time
                        example: '2026-10-16T18:01:45.000Z'
                        description: Publication date in ISO 8601 format
                      likeCount:
                        type: integer
                        example: 2277215
                        description: Number of likes
                      commentCount:
                        type: integer
                        example: 24768
                        description: Number of comments
                      attributedTo:
                        anyOf:
                        - $ref: '#/components/schemas/InstagramEmbeddedUser'
                        - type: array
                          items:
                            $ref: '#/components/schemas/InstagramEmbeddedUser'
                        description: Post author or collaborators
                      location:
                        $ref: '#/components/schemas/InstagramLocation'
                        description: Post location tag
                      tag:
                        type: array
                        items:
                          $ref: '#/components/schemas/InstagramTag'
                        description: Tagged users or hashtags
                      language:
                        type: string
                        description: Content language (BCP47 code)
                        example: en
                      isEdited:
                        type: boolean
                        example: false
                        description: Whether the caption has been edited
                      isSponsored:
                        type: boolean
                        example: true
                        description: Whether post is a paid partnership
                      pinnedBy:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - Person
                            entityId:
                              type: string
