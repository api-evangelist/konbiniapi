openapi: 3.2.0
info:
  title: Konbini Instagram API
  version: 1.0.0
  description: 'Social media API that normalizes TikTok, Instagram, YouTube, Reddit, X, and LinkedIn data into a consistent ActivityStreams 2.0 format.


    Every authenticated response includes `X-Credits-Remaining` and `X-Credits-Used` headers. Each successful request costs 1 credit. Requests that fail with 400, 5xx, or upstream errors are refunded (X-Credits-Used: 0).'
  contact:
    name: KonbiniAPI
    email: hello@konbiniapi.com
    url: https://konbiniapi.com
servers:
- url: https://api.konbiniapi.com
  description: Production
security:
- apiKey: []
tags:
- name: Instagram
  description: Instagram data endpoints
paths:
  /v1/instagram/users/{username}:
    get:
      operationId: instagramGetUser
      tags:
      - Instagram
      summary: Get user profile
      description: Returns profile information for an Instagram user including bio, follower counts, profile picture, and account metadata. Look up any public Instagram account by username, or pass ?userId= to look up by numeric user ID instead.
      parameters:
      - schema:
          type: string
          description: Instagram username (with or without @ symbol)
          example: cristiano
        required: true
        description: Instagram username (with or without @ symbol)
        name: username
        in: path
      - schema:
          type: string
          pattern: ^\d+$
          description: Look up the account by its numeric Instagram user ID instead of its username. If you already have the ID (e.g. from a post or comment's attributedTo field in another response), passing it here returns the profile faster than a username lookup. When set, it overrides the username in the URL — any placeholder there works.
          example: '173560420'
        required: false
        description: Look up the account by its numeric Instagram user ID instead of its username. If you already have the ID (e.g. from a post or comment's attributedTo field in another response), passing it here returns the profile faster than a username lookup. When set, it overrides the username in the URL — any placeholder there works.
        name: userId
        in: query
      responses:
        '200':
          description: Returns the Instagram user profile
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      type:
                        type: string
                        description: ActivityStreams object type
                        example: Person
                      id:
                        type: string
                        format: uri
                        description: Profile URL
                        example: https://www.instagram.com/cristiano/
                      url:
                        type: string
                        format: uri
                        description: Profile URL
                        example: https://www.instagram.com/cristiano/
                      entityId:
                        type: string
                        description: Platform-specific entity ID
                        example: '173560420'
                      name:
                        type: string
                        description: Display name
                        example: Cristiano Ronaldo
                      preferredUsername:
                        type: string
                        description: Username or handle
                        example: cristiano
                      summary:
                        type: string
                        description: Bio text
                        example: Al Nassr and Portugal captain
                      attachment:
                        type: array
                        items:
                          $ref: '#/components/schemas/InstagramLink'
                        description: External links
                      isPrivate:
                        type: boolean
                        description: Whether account is private
                        example: false
                      isVerified:
                        type: boolean
                        description: Whether account is verified
                        example: true
                      isPaidVerified:
                        type: boolean
                        description: Whether account has paid verification
                        example: false
                      isBusiness:
                        type: boolean
                        description: Whether account has business features enabled
                        example: false
                      isProfessional:
                        type: boolean
                        description: Whether account has professional/creator features enabled
                        example: true
                      category:
                        type: string
                        description: Business or creator category
                        example: Public figure
                      pronouns:
                        type: array
                        items:
                          type: string
                        description: User pronouns
                        example:
                        - he/him
                      hasVideos:
                        type: boolean
                        description: Whether user has video content
                        example: true
                      hasChannel:
                        type: boolean
                        description: Whether user has a broadcast channel
                        example: false
                      hasMicroblog:
                        type: boolean
                        description: Whether user has Threads content
                        example: false
                      followerCount:
                        type: integer
                        description: Number of followers
                        example: 680048553
                      followingCount:
                        type: integer
                        description: Number of accounts followed
                        example: 637
                      mediaCount:
                        type: integer
                        description: Number of posts
                        example: 0
                      videoCount:
                        type: integer
                        description: Number of Reels
                        example: 1
                      highlightCount:
                        type: integer
                        description: Number of story highlights
                        example: 0
                      icon:
                        $ref: '#/components/schemas/InstagramImage'
                        description: User profile picture
                      image:
                        type: array
                        items:
                          $ref: '#/components/schemas/InstagramImage'
                        description: Profile pictures in multiple sizes
                    required:
                    - '@context'
                    - type
                    - id
                    - url
                    - entityId
                    - name
                    - preferredUsername
                    - isPrivate
                    - isVerified
                    - isPaidVerified
                    - isBusiness
                    - isProfessional
                    - hasVideos
                    - hasChannel
                    - hasMicroblog
                    - followerCount
                    - followingCount
                    - mediaCount
                    - videoCount
                    - highlightCount
                required:
                - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/CreditsExhaustedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PlatformError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/PlatformTimeoutError'
  /v1/instagram/users/{username}/posts:
    get:
      operationId: instagramGetUserPosts
      tags:
      - Instagram
      summary: Get user posts
      description: Returns a paginated list of posts from an Instagram user's profile feed. Maximum 12 posts per page. Includes photos, videos, carousels, and engagement counts.
      parameters:
      - schema:
          type: string
          description: Instagram username (with or without @ symbol)
          example: cristiano
        required: true
        description: Instagram username (with or without @ symbol)
        name: username
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 12
          default: 12
          description: 'Number of posts to fetch (maximum: 12)'
          example: 12
        required: false
        description: 'Number of posts to fetch (maximum: 12)'
        name: count
        in: query
      - schema:
          type: string
          description: Pagination cursor
          example: '0'
        required: false
        description: Pagination cursor
        name: cursor
        in: query
      responses:
        '200':
          description: Returns the user posts
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      type:
                        type: string
                        description: ActivityStreams collection type
                        example: OrderedCollectionPage
                      partOf:
                        type: string
                        format: uri
                        description: URL of the full collection
                        example: https://api.konbiniapi.com/v1/instagram/users/cristiano/posts
                      totalItems:
                        type:
                        - integer
                        - 'null'
                        description: Total number of items, null if unknown
                        example: 1309
                      cursor:
                        type:
                        - string
                        - 'null'
                        description: Current page cursor, null on first page
                        example: null
                      nextCursor:
                        type:
                        - string
                        - 'null'
                        description: Cursor for the next page, null on last page
                        example: abc123
                      next:
                        type:
                        - string
                        - 'null'
                        format: uri
                        description: URL for the next page, null on last page
                        example: https://api.konbiniapi.com/v1/instagram/users/cristiano/posts?cursor=abc123&count=12
                      itemCount:
                        type: integer
                        description: Number of items returned in this page
                        example: 30
                      orderedItems:
                        type: array
                        items:
                          $ref: '#/components/schemas/InstagramPost'
                        description: Items in this page
                    required:
                    - '@context'
                    - type
                    - partOf
                    - totalItems
                    - cursor
                    - nextCursor
                    - next
                    - itemCount
                    - orderedItems
                required:
                - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/CreditsExhaustedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PlatformError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/PlatformTimeoutError'
  /v1/instagram/users/{username}/reels:
