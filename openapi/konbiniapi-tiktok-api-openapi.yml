components:
  schemas:
    TikTokLink:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Link
        href:
          type: string
          format: uri
          description: Link URL
          example: https://linktr.ee/khaby.lame
        name:
          type: string
          description: Link label — the template name, or the streaming service
          example: CapCut · Video Editor
        rel:
          type: string
          description: Link relation hint
          example: preferred
      required:
      - type
      - href
      description: External link
    NotFoundError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                - not_found
                - route_not_found
                description: Machine-readable error code
              message:
                type: string
                example: Not found
                description: Human-readable error message
            required:
            - code
            - message
          description: List of errors
        data:
          type: 'null'
          description: Always null for error responses
      required:
      - errors
      - data
    ValidationError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                - validation_error
                description: Machine-readable error code
              message:
                type: string
                example: Validation error
                description: Human-readable error message
            required:
            - code
            - message
          description: List of errors
        data:
          type: 'null'
          description: Always null for error responses
      required:
      - errors
      - data
    PlatformError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                - platform_error
                description: Machine-readable error code
              message:
                type: string
                example: Platform error
                description: Human-readable error message
            required:
            - code
            - message
          description: List of errors
        data:
          type: 'null'
          description: Always null for error responses
      required:
      - errors
      - data
    TikTokHashtag:
      type: object
      properties:
        type:
          type: string
          enum:
          - Tag
          description: ActivityStreams object type
          example: Tag
        name:
          type: string
          description: Tag name
          example: learnfromkhaby
        href:
          type: string
          format: uri
          example: https://www.tiktok.com/tag/learnfromkhaby
          description: Tag URL
        id:
          type: string
          format: uri
          example: https://www.tiktok.com/tag/learnfromkhaby
          description: Tag permalink
        entityId:
          type: string
          example: '1697657584273413'
          description: TikTok internal tag ID
        summary:
          type: string
          example: Khaby Lame shows the simpler way
          description: The hashtag's own description
        startIndex:
          type: integer
          example: 26
          description: Where this entity starts in `content`, counted in Unicode codepoints (not UTF-16 code units). In a UTF-16 language such as JavaScript, slice with `[...content].slice(startIndex, endIndex)` rather than `content.slice(...)`, which is off by one per emoji before it.
        endIndex:
          type: integer
          example: 41
          description: Where this entity ends in `content`, exclusive, counted in Unicode codepoints. See `startIndex`.
        isSponsored:
          type: boolean
          example: false
          description: Whether TikTok marks the entity as commerce
      required:
      - type
      - name
      description: Hashtag
    TikTokVideoDownloadUrl:
      type: object
      properties:
        '@context':
          type: array
          prefixItems:
          - type: string
            enum:
            - https://www.w3.org/ns/activitystreams#
          - type: string
            enum:
            - https://konbiniapi.com/ns/social#
          description: ActivityStreams JSON-LD context
          example:
          - https://www.w3.org/ns/activitystreams#
          - https://konbiniapi.com/ns/social#
        type:
          type: string
          enum:
          - Video
          example: Video
        url:
          type: string
          format: uri
          description: Downloadable video file URL. Works with a plain GET request — no cookies, auth headers, or special HTTP client required. Not permanent, only valid for a few hours — do not store it for later use, request a fresh one when you need it.
          example: https://v16m-default.tiktokcdn-us.com/56a57de5359b7af870271159a2b3e47f/6ad4ffae/video/tos/useast8/tos-useast8-pve-0068-tx2/okAtBQJDE2EBABOobPVaUIr8ztS8Vii6QRmMZ/
        mediaType:
          type: string
          enum:
          - video/mp4
          example: video/mp4
      required:
      - '@context'
      - type
      - url
      - mediaType
      description: A temporary link to a downloadable video file
    PlatformTimeoutError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                - platform_error
                description: Machine-readable error code
              message:
                type: string
                example: Platform error
                description: Human-readable error message
            required:
            - code
            - message
          description: List of errors
        data:
          type: 'null'
          description: Always null for error responses
      required:
      - errors
      - data
    TikTokImage:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Image
