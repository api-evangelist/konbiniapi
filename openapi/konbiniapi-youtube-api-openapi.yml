openapi: 3.2.0
info:
  title: Konbini YouTube API
  version: 1.0.0
  description: 'Social media API that normalizes TikTok, Instagram, YouTube, Reddit, X, and LinkedIn data into a consistent ActivityStreams 2.0 format.


    Every authenticated response includes `X-Credits-Remaining` and `X-Credits-Used` headers. Each successful request costs 1 credit. Requests that fail with 400, 5xx, or upstream errors are refunded (X-Credits-Used: 0).'
  contact:
    name: KonbiniAPI
    email: hello@konbiniapi.com
    url: https://konbiniapi.com
servers:
- url: https://api.konbiniapi.com
  description: Production
security:
- apiKey: []
tags:
- name: Youtube
  description: YouTube data endpoints
paths:
  /v1/youtube/channels/{channel}:
    get:
      operationId: youtubeGetChannel
      tags:
      - Youtube
      summary: Get channel
      description: 'Returns a public YouTube channel: name, handle, description, avatar, banner, subscriber and video counts, links, and RSS feed.'
      parameters:
      - schema:
          type: string
          description: 'Channel handle, with or without the `@`: the name in a channel URL. If you pass `channelId`, this is ignored and any placeholder works.'
          example: '@MrBeast'
        required: true
        description: 'Channel handle, with or without the `@`: the name in a channel URL. If you pass `channelId`, this is ignored and any placeholder works.'
        name: channel
        in: path
      - schema:
          type: string
          description: Look up the channel by its `UC…` ID instead of its handle. If you already have the ID (e.g. from a video's `attributedTo` in another response), passing it here returns the channel faster than a handle lookup. When set, it overrides the handle in the URL.
          example: UCX6OQ3DkcsbYNE6H8uQQuVA
        required: false
        description: Look up the channel by its `UC…` ID instead of its handle. If you already have the ID (e.g. from a video's `attributedTo` in another response), passing it here returns the channel faster than a handle lookup. When set, it overrides the handle in the URL.
        name: channelId
        in: query
      responses:
        '200':
          description: Returns the channel
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      type:
                        type: string
                        enum:
                        - Person
                        example: Person
                      id:
                        type: string
                        format: uri
                        description: Channel URL
                        example: https://www.youtube.com/channel/UCX6OQ3DkcsbYNE6H8uQQuVA
                      url:
                        type: string
                        format: uri
                        description: Channel URL
                        example: https://www.youtube.com/channel/UCX6OQ3DkcsbYNE6H8uQQuVA
                      entityId:
                        type: string
                        description: YouTube channel ID
                        example: UCX6OQ3DkcsbYNE6H8uQQuVA
                      preferredUsername:
                        type: string
                        example: '@MrBeast'
                        description: Channel handle
                      name:
                        type: string
                        description: Channel name
                        example: MrBeast
                      content:
                        type: string
                        example: 'SUBSCRIBE FOR A COOKIE!

                          New MrBeast or MrBeast Gaming video every single Saturday at noon eastern time!

                          Accomplishments:

                          - Raised $20,000,000 To Plant 20,000,000 Trees

                          - Removed 30,000,000 pounds of trash from the ocean

                          - Helped 2,000 people walk again

                          - Helped 1,000 blind…'
                        description: Channel description
                      followerCount:
                        type: integer
                        description: Rounded to what YouTube displays (515M becomes 515000000); no exact figure exists
                        example: 522000000
                      videoCount:
                        type: integer
                        description: Rounded to what YouTube displays (515M becomes 515000000); no exact figure exists
                        example: 1000
                      isAdult:
                        type: boolean
                        example: false
                        description: Whether the channel is marked not family-safe
                      icon:
                        $ref: '#/components/schemas/YoutubeImage'
                      image:
                        type: array
                        items:
                          $ref: '#/components/schemas/YoutubeImage'
                        description: Channel banner image
                      tag:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              description: ActivityStreams object type
                              example: Tag
                            name:
                              type: string
                              description: Tag name
                              example: mrbeast6000
                          required:
                          - type
                          - name
                        description: Channel keywords
                      availableIn:
                        type: array
                        items:
                          type: string
                          example: US
                        description: ISO 3166-1 alpha-2 country codes the channel is available in
                      attachment:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - Link
                              example: Link
                            href:
                              type: string
                              format: uri
                              example: https://www.youtube.com/feeds/videos.xml?channel_id=UCX6OQ3DkcsbYNE6H8uQQuVA
                            rel:
                              type: string
                              example: alternate
                            mediaType:
                              type: string
                              example: application/rss+xml
                          required:
                          - type
                          - href
                        description: 'The channel''s RSS feed (`rel: ''alternate''`), then the links it lists: its website and other social profiles'
                    required:
                    - '@context'
                    - type
                    - id
                    - url
                    - entityId
                    - name
                required:
                - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/CreditsExhaustedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PlatformError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/PlatformTimeoutError'
  /v1/youtube/channels/{channel}/about:
    get:
      operationId: youtubeGetChannelAbout
      tags:
      - Youtube
      summary: Get channel about page
      description: 'Returns a public YouTube channel''s About panel: full description, lifetime view count, creation date, and country.'
      parameters:
      - schema:
          type: string
          description: 'Channel handle, with or without the `@`: the name in a channel URL. If you pass `channelId`, this is ignored and any placeholder works.'
          example: '@MrBeast'
        required: true
        description: 'Channel handle, with or without the `@`: the name in a channel URL. If you pass `channelId`, this is ignored and any placeholder works.'
        name: channel
        in: path
      - schema:
          type: string
          description: Look up the channel by its `UC…` ID instead of its handle. If you already have the ID (e.g. from a video's `attributedTo` in another response), passing it here returns the channel faster than a handle lookup. When set, it overrides the handle in the URL.
          example: UCX6OQ3DkcsbYNE6H8uQQuVA
        required: false
        description: Look up the channel by its `UC…` ID instead of its handle. If you already have the ID (e.g. from a video's `attributedTo` in another response), passing it here returns the channel faster than a handle lookup. When set, it overrides the handle in the URL.
        name: channelId
        in: query
      responses:
        '200':
          description: Returns the channel about info
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      type:
                        type: string
                        enum:
                        - Person
                        example: Person
                      id:
                        type: string
                        format: uri
                        description: Channel URL
                        example: https://www.youtube.com/channel/UCX6OQ3DkcsbYNE6H8uQQuVA
                      url:
                        type: string
                        format: uri
                        description: Channel URL
                        example: https://www.youtube.com/channel/UCX6OQ3DkcsbYNE6H8uQQuVA
                      entityId:
                        type: string
                        description: YouTube channel ID
                        example: UCX6OQ3DkcsbYNE6H8uQQuVA
                      content:
                        type: string
                        example: 'SUBSCRIBE FOR A COOKIE!

                          New MrBeast or MrBeast Gaming video every single Saturday at noon eastern time!

                          Accomplishments:

                          - Raised $20,000,000 To Plant 20,000,000 Trees

                          - Removed 30,000,000 pounds of trash from the ocean

                          - Helped 2,000 people walk again

                          - Helped 1,000 blind…'
                        description: Channel description
                      published:
                        type: string
                        format: date-time
                        example: '2012-02-19T00:00:00.000Z'
                        description: Channel creation date
                      viewCount:
                        type: integer
                        example: 143240927814
                        description: Exact lifetime view count across the channel
                      followerCount:
                        type: integer
                        description: Rounded to what YouTube displays (515M becomes 515000000); no exact figure exists
                        example: 522000000
                      videoCount:
                        type: integer
                        description: Rounded to what YouTube displays (515M becomes 515000000); no exact figure exists
                        example: 1008
                      addressCountry:
                        type: string
                        example: United States
                        description: Country the channel is registered to
                    required:
                    - '@context'
                    - type
                    - id
                    - url
                    - entityId
                required:
                - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/CreditsExhaustedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PlatformError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/PlatformTimeoutError'
  /v1/youtube/channels/{channel}/videos:
    get:
      operationId: youtubeGetChannelVideos
      tags:
      - Youtube
      summary: Get channel videos
      description: Returns a public YouTube channel's uploaded videos, most recent first.
      parameters:
      - schema:
          type: string
          description: 'Channel handle, with or without the `@`: the name in a channel URL. If you pass `channelId`, this is ignored and any placeholder works.'
          example: '@MrBeast'
        required: true
        description: 'Channel handle, with or without the `@`: the name in a channel URL. If you pass `channelId`, this is ignored and any placeholder works.'
        name: channel
        in: path
      - schema:
          type: string
          description: Look up the channel by its `UC…` ID instead of its handle. If you already have the ID (e.g. from a video's `attributedTo` in another response), passing it here returns the channel faster than a handle lookup. When set, it overrides the handle in the URL.
          example: UCX6OQ3DkcsbYNE6H8uQQuVA
        required: false
        description: Look up the channel by its `UC…` ID instead of its handle. If you already have the ID (e.g. from a video's `attributedTo` in another response), passing it here returns the channel faster than a handle lookup. When set, it overrides the handle in the URL.
        name: channelId
        in: query
      - schema:
          type: string
          enum:
          - newest
          - popular
          - oldest
          description: Sort order for the listing
          example: popular
        required: false
        description: Sort order for the listing
        name: order
        in: query
      - schema:
          type: string
          description: Pagination cursor
          example: '0'
        required: false
        description: Pagination cursor
        name: cursor
        in: query
      responses:
        '200':
          description: Returns the channel videos
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      type:
                        type: string
                        description: ActivityStreams collection type
                        example: OrderedCollectionPage
                      partOf:
                        type: string
                        format: uri
                        description: URL of the full collection
                        example: https://api.konbiniapi.com/v1/youtube/channels/UCX6OQ3DkcsbYNE6H8uQQuVA/videos
                      totalItems:
                        type:
                        - integer
                        - 'null'
                        description: Total number of items, null if unknown
                        example: null
                      cursor:
                        type:
                        - string
                        - 'null'
                        description: Current page cursor, null on first page
                        example: null
                      nextCursor:
                        type:
                        - string
                        - 'null'
                        description: Cursor for the next page, null on last page
                        example: <token>
                      next:
                        type:
                        - string
                        - 'null'
                        format: uri
                        description: URL for the next page, null on last page
                        example: https://api.konbiniapi.com/v1/youtube/channels/UCX6OQ3DkcsbYNE6H8uQQuVA/videos?cursor=<token>
                      itemCount:
                        type: integer
                        description: Number of items returned in this page
                        example: 30
                      orderedItems:
                        type: array
                        items:
                          $ref: '#/components/schemas/YoutubeChannelVideoItem'
                        description: Items in this page
                    required:
                    - '@context'
                    - type
                    - partOf
                    - totalItems
                    - cursor
                    - nextCursor
                    - next
                    - itemCount
                    - orderedItems
                required:
                - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/CreditsExhaustedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PlatformError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/PlatformTimeoutError'
