    get:
      operationId: youtubeGetVideo
      tags:
      - Youtube
      summary: Get video
      description: 'Returns a public YouTube video: title, description, counts, publish date, channel, thumbnails, keywords, and available caption languages. For the transcript text, use the transcript endpoint.'
      parameters:
      - schema:
          type: string
          description: YouTube video ID (the `v=` value from a watch URL)
          example: plN7JMbadRg
        required: true
        description: YouTube video ID (the `v=` value from a watch URL)
        name: videoId
        in: path
      responses:
        '200':
          description: Returns the video
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      type:
                        type: string
                        description: ActivityStreams object type
                        example: Video
                      id:
                        type: string
                        format: uri
                        description: Video URL
                        example: https://www.youtube.com/watch?v=plN7JMbadRg
                      url:
                        type: string
                        format: uri
                        description: Video URL
                        example: https://www.youtube.com/watch?v=plN7JMbadRg
                      entityId:
                        type: string
                        description: YouTube video ID
                        example: plN7JMbadRg
                      name:
                        type: string
                        description: Video title
                        example: Eat Everything In A Grocery Store, Win $1,000,000
                      content:
                        type: string
                        example: 'I trapped 4 strangers in an entire supermarket and the only way out is eating everything inside


                          The guys wore Fitbit Air to track their health and fitness throughout their entire time in the store. See what they achieved during the Google Health Awards. GooglePartner

                          Google…'
                        description: Video description
                      published:
                        type: string
                        format: date-time
                        description: Publication date in ISO 8601 format
                        example: '2026-10-03T16:00:01.000Z'
                      duration:
                        type: number
                        example: 3479
                        description: Duration in seconds
                      viewCount:
                        type: integer
                        description: Exact number of views
                        example: 275722212
                      likeCount:
                        type: integer
                        example: 4155962
                        description: Exact number of likes
                      commentCount:
                        type: integer
                        example: 155000
                        description: Comment count, rounded to what YouTube displays (155K becomes 155000)
                      isAdult:
                        type: boolean
                        example: false
                        description: Whether the video is marked not family-safe
                      visibility:
                        type: string
                        enum:
                        - unlisted
                        description: Present and set to "unlisted" when the video is unlisted. Absent otherwise — YouTube gives no signal distinguishing public from private.
                        example: unlisted
                      availableIn:
                        type: array
                        items:
                          type: string
                          example: US
                        description: ISO 3166-1 alpha-2 country codes the video is available in
                      category:
                        type: string
                        example: Entertainment
                        description: YouTube category the video is filed under
                      isLive:
                        type: boolean
                        example: false
                        description: Whether the video is a livestream (currently live or was streamed live)
                      startTime:
                        type: string
                        format: date-time
                        description: When a livestream started broadcasting
                        example: '2026-01-01T18:00:00.000Z'
                      endTime:
                        type: string
                        format: date-time
                        description: When a livestream ended
                        example: '2026-01-01T20:00:00.000Z'
                      attributedTo:
                        type: object
                        properties:
                          type:
                            type: string
                            description: ActivityStreams object type
                            example: Person
                          id:
                            type: string
                            format: uri
                            description: Profile URL
                            example: https://www.youtube.com/channel/UCX6OQ3DkcsbYNE6H8uQQuVA
                          url:
                            type: string
                            format: uri
                            description: Profile URL
                            example: https://www.youtube.com/channel/UCX6OQ3DkcsbYNE6H8uQQuVA
                          entityId:
                            type: string
                            example: UCX6OQ3DkcsbYNE6H8uQQuVA
                            description: Platform-specific entity ID
                          name:
                            type: string
                            example: MrBeast
                            description: Display name
                          preferredUsername:
                            type: string
                            example: '@MrBeast'
                            description: Channel handle, with its leading @
                          isVerified:
                            type: boolean
                            example: true
                            description: Whether the channel is verified
                          followerCount:
                            type: integer
                            description: Rounded to what YouTube displays (515M becomes 515000000); no exact figure exists
                            example: 522000000
                          icon:
                            $ref: '#/components/schemas/YoutubeImage'
                        required:
                        - type
                        - id
                        - url
                        description: Channel that uploaded the video
                      image:
                        type: array
                        items:
                          $ref: '#/components/schemas/YoutubeImage'
                        description: Thumbnail images
                      tag:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              description: ActivityStreams object type
                              example: Tag
                            name:
                              type: string
                              description: Tag name
                              example: mrbeast6000
                          required:
                          - type
                          - name
                        description: Video keywords
                      captions:
                        type: array
                        items:
                          $ref: '#/components/schemas/YoutubeCaptionTrack'
                        description: Caption tracks available for this video. Lists languages offered, not the transcript text.
                    required:
                    - '@context'
                    - type
                    - id
                    - url
                    - entityId
                    - name
                    - published
                    - viewCount
                required:
                - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/CreditsExhaustedError'
