openapi: 3.2.0
info:
  title: Konbini LinkedIn API
  version: 1.0.0
  description: 'Social media API that normalizes TikTok, Instagram, YouTube, Reddit, X, and LinkedIn data into a consistent ActivityStreams 2.0 format.


    Every authenticated response includes `X-Credits-Remaining` and `X-Credits-Used` headers. Each successful request costs 1 credit. Requests that fail with 400, 5xx, or upstream errors are refunded (X-Credits-Used: 0).'
  contact:
    name: KonbiniAPI
    email: hello@konbiniapi.com
    url: https://konbiniapi.com
servers:
- url: https://api.konbiniapi.com
  description: Production
security:
- apiKey: []
tags:
- name: Linked In
  description: LinkedIn data endpoints
paths:
  /v1/linkedin/users/{username}:
    get:
      operationId: linkedinGetUser
      tags:
      - Linked In
      summary: Get user profile
      description: 'Returns profile information for a public LinkedIn member: headline, location, and a simple list of job titles and school/employer names. Fields the member has restricted are omitted.'
      parameters:
      - schema:
          type: string
          description: LinkedIn username
          example: williamhgates
        required: true
        description: LinkedIn username
        name: username
        in: path
      responses:
        '200':
          description: Returns the LinkedIn user profile
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      type:
                        type: string
                        description: ActivityStreams object type
                        example: Person
                      id:
                        type: string
                        format: uri
                        description: Profile URL
                        example: https://www.linkedin.com/in/williamhgates
                      url:
                        type: string
                        format: uri
                        description: Profile URL
                        example: https://www.linkedin.com/in/williamhgates
                      name:
                        type: string
                        description: Display name
                        example: Bill Gates
                      preferredUsername:
                        type: string
                        description: Username or handle
                        example: williamhgates
                      summary:
                        type:
                        - string
                        - 'null'
                        example: Chair of the Gates Foundation. Founder of Breakthrough Energy. Co-founder of Microsoft. Voracious reader. Avid traveler. Active blogger.
                        description: Headline / short bio
                      location:
                        type: string
                        example: Seattle, Washington, United States, US
                        description: Locality, region, country
                      address:
                        $ref: '#/components/schemas/LinkedInAddress'
                      followerCount:
                        type: integer
                        example: 40733856
                        description: Follower/connection count
                      icon:
                        $ref: '#/components/schemas/LinkedInImage'
                      headline:
                        type: string
                        example: Chair, Gates Foundation and Founder, Breakthrough Energy
                        description: The line under the name. LinkedIn serves it on only some responses, so it can be absent for a profile that has one.
                      role:
                        type: array
                        items:
                          type: string
                          example: Co-chair
                        description: Deprecated — a flat list with nothing saying which title goes with which organization. Use worksFor[].role.
                        deprecated: true
                      affiliation:
                        type: array
                        items:
                          type: string
                          example: Gates Foundation
                        description: Deprecated — names only. Use worksFor.
                        deprecated: true
                      education:
                        type: array
                        items:
                          type: string
                          example: Harvard University
                        description: Deprecated — names only. Use alumniOf.
                        deprecated: true
                      worksFor:
                        type: array
                        items:
                          $ref: '#/components/schemas/LinkedInHistoryEntry'
                        description: 'Work history: one entry per organization, with the role, the dates and the description shown under it'
                      award:
                        type: array
                        items:
                          type: string
                        description: Honors the profile lists
                        example:
                        - Sigillum Magnum
                      knowsLanguage:
                        type: array
                        items:
                          type: string
                        description: Languages the profile lists
                        example:
                        - English
                        - Spanish
                      alumniOf:
                        type: array
                        items:
                          $ref: '#/components/schemas/LinkedInHistoryEntry'
                        description: Education history, same shape as worksFor
                      language:
                        type: array
                        items:
                          type: string
                        description: Languages the member lists as known
                        example:
                        - English
                    required:
                    - '@context'
                    - type
                    - id
                    - url
                    - name
                    - preferredUsername
                    - summary
                required:
                - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/CreditsExhaustedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PlatformError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/PlatformTimeoutError'
  /v1/linkedin/users/{username}/posts:
    get:
      operationId: linkedinGetUserPosts
      tags:
      - Linked In
      summary: Get user posts
      description: Returns a public LinkedIn member's recent posts and shares. This endpoint is not paginated — everything available is returned in a single response.
      parameters:
      - schema:
          type: string
          description: LinkedIn username
          example: williamhgates
        required: true
        description: LinkedIn username
        name: username
        in: path
      responses:
        '200':
          description: Returns the member’s recent posts
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      type:
                        type: string
                        enum:
                        - OrderedCollection
                        example: OrderedCollection
                      id:
                        type: string
                        format: uri
                        description: Collection permalink
                        example: https://www.linkedin.com/in/williamhgates/posts/
                      url:
                        type: string
                        format: uri
                        description: Collection permalink
                        example: https://www.linkedin.com/in/williamhgates/posts/
                      totalItems:
                        type: integer
                        description: Number of posts returned
                        example: 7
                      orderedItems:
                        type: array
                        items:
                          $ref: '#/components/schemas/LinkedInRecentPost'
                        description: Recent posts/shares
                    required:
                    - '@context'
                    - type
                    - id
                    - url
                    - totalItems
                    - orderedItems
                required:
                - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/CreditsExhaustedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PlatformError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/PlatformTimeoutError'
  /v1/linkedin/users/{username}/articles:
    get:
      operationId: linkedinGetUserArticles
      tags:
      - Linked In
      summary: Get user articles
      description: Returns a public LinkedIn member's published articles. This endpoint is not paginated — everything available is returned in a single response.
      parameters:
      - schema:
          type: string
          description: LinkedIn username
          example: williamhgates
        required: true
        description: LinkedIn username
        name: username
        in: path
      responses:
        '200':
          description: Returns the member’s published articles
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      type:
                        type: string
                        enum:
                        - OrderedCollection
                        example: OrderedCollection
                      id:
                        type: string
                        format: uri
                        description: Collection permalink
                        example: https://www.linkedin.com/in/williamhgates/articles/
                      url:
                        type: string
                        format: uri
                        description: Collection permalink
                        example: https://www.linkedin.com/in/williamhgates/articles/
                      totalItems:
                        type: integer
                        description: Number of articles returned
                        example: 10
                      orderedItems:
                        type: array
                        items:
                          $ref: '#/components/schemas/LinkedInArticle'
                        description: Published articles
                    required:
                    - '@context'
                    - type
                    - id
                    - url
                    - totalItems
                    - orderedItems
                required:
                - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/CreditsExhaustedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PlatformError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/PlatformTimeoutError'
  /v1/linkedin/companies/{company}:
    get:
      operationId: linkedinGetCompany
      tags:
      - Linked In
      summary: Get company page
      description: Returns public information for a LinkedIn company page including description, location, employee count, and logo.
      parameters:
      - schema:
          type: string
          description: Company vanity name
          example: microsoft
        required: true
        description: Company vanity name
        name: company
        in: path
      responses:
        '200':
          description: Returns the LinkedIn company page
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      type:
                        type: string
                        description: ActivityStreams object type
                        example: Organization
                      id:
                        type: string
                        format: uri
                        description: Company page URL
                        example: https://www.linkedin.com/company/microsoft
                      url:
                        type: string
                        format: uri
                        description: Company page URL
                        example: https://www.linkedin.com/company/microsoft
                      name:
                        type: string
                        description: Company name
                        example: Microsoft
                      preferredUsername:
                        type: string
                        description: Company vanity name
                        example: microsoft
                      summary:
                        type:
                        - string
                        - 'null'
                        example: Every company has a mission. What's ours? To empower every person and every organization to achieve more. We believe technology can and should be a force for good and that meaningful innovation contributes to a brighter world in the future and today. Our culture doesn’t just…
                        description: Company description
                      location:
                        type: string
                        example: Redmond, Washington, US
                        description: Locality, region, country
                      address:
                        allOf:
                        - $ref: '#/components/schemas/LinkedInAddress'
                        - example:
                            streetAddress: 354 Oyster Point Blvd
                            addressLocality: South San Francisco
                            addressRegion: California
                            postalCode: '94080'
                            addressCountry: US
                      memberCount:
                        type: integer
                        example: 231136
                        description: Reported employee count
                      icon:
                        allOf:
                        - $ref: '#/components/schemas/LinkedInImage'
                        - description: Company logo
                      tagline:
                        type: string
                        description: Company slogan/tagline
                        example: Empowering every person and every organization on the planet to achieve more.
                      attachment:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - Link
                              example: Link
                            href:
                              type: string
                              format: uri
                              example: https://news.microsoft.com/
                          required:
                          - type
                          - href
                        description: External company links
                    required:
                    - '@context'
                    - type
                    - id
                    - url
                    - name
                    - preferredUsername
                    - summary
                required:
                - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/CreditsExhaustedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PlatformError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/PlatformTimeoutError'
  /v1/linkedin/companies/{company}/posts:
    get:
      operationId: linkedinGetCompanyPosts
      tags:
      - Linked In
      summary: Get company posts
      description: Returns recent posts from a LinkedIn company page, newest first. Use `cursor` to page through further results.
      parameters:
      - schema:
          type: string
          description: Company vanity name
          example: microsoft
        required: true
        description: Company vanity name
        name: company
        in: path
      - schema:
          type: string
          description: Pagination cursor
          example: '0'
        required: false
        description: Pagination cursor
        name: cursor
        in: query
      responses:
        '200':
          description: Returns posts from this company page
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      type:
                        type: string
                        description: ActivityStreams collection type
                        example: OrderedCollectionPage
                      partOf:
                        type: string
                        format: uri
                        description: URL of the full collection
                        example: https://api.konbiniapi.com/v1/linkedin/companies/microsoft/posts
                      totalItems:
                        type:
                        - integer
                        - 'null'
                        description: Total number of items, null if unknown
                        example: null
                      cursor:
                        type:
                        - string
                        - 'null'
                        description: Current page cursor, null on first page
                        example: null
                      nextCursor:
                        type:
                        - string
                        - 'null'
                        description: Cursor for the next page, null on last page
                        example: eyJvIjoi
                      next:
                        type:
                        - string
                        - 'null'
                        format: uri
                        description: URL for the next page, null on last page
                        example: https://api.konbiniapi.com/v1/linkedin/companies/microsoft/posts?cursor=eyJvIjoi
                      itemCount:
                        type: integer
                        description: Number of items returned in this page
                        example: 30
                      orderedItems:
                        type: array
                        items:
                          $ref: '#/components/schemas/LinkedInCompanyPost'
                        description: Items in this page
                    required:
                    - '@context'
                    - type
                    - partOf
                    - totalItems
                    - cursor
                    - nextCursor
                    - next
                    - itemCount
                    - orderedItems
                required:
                - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/CreditsExhaustedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PlatformError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/PlatformTimeoutError'
  /v1/linkedin/posts/{postId}:
    get:
      operationId: linkedinGetPost
      tags:
      - Linked In
      summary: Get post
      description: Returns a public LinkedIn post including author, engagement counts, and up to ~5 inline comments.
      parameters:
      - schema:
          type: string
          description: 'LinkedIn post activity ID: the full slug (from linkedin.com/posts/{id}), a bare `urn:li:activity:{id}` (from linkedin.com/feed/update/{urn}/), or a bare numeric activity ID (e.g. `7517390588447621121`)'
          example: williamhgates_made-in-africa-new-measles-rapid-diagnostic-activity-7517390588447621121-fbmC
        required: true
        description: 'LinkedIn post activity ID: the full slug (from linkedin.com/posts/{id}), a bare `urn:li:activity:{id}` (from linkedin.com/feed/update/{urn}/), or a bare numeric activity ID (e.g. `7517390588447621121`)'
        name: postId
        in: path
      responses:
        '200':
          description: Returns the LinkedIn post
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      isAdult:
                        type: boolean
                        example: false
                        description: Whether the post is marked not family-friendly
                      type:
                        type: string
                        description: ActivityStreams object type
                        example: Note
                      id:
                        type: string
                        format: uri
                        description: Post permalink
                        example: https://www.linkedin.com/posts/williamhgates_made-in-africa-new-measles-rapid-diagnostic-activity-7517390588447621121-fbmC
                      url:
                        type: string
                        format: uri
                        description: Post permalink
                        example: https://www.linkedin.com/posts/williamhgates_made-in-africa-new-measles-rapid-diagnostic-activity-7517390588447621121-fbmC
                      entityId:
                        type: string
                        example: '7517390588447621121'
                        description: Numeric activity ID, usable directly as :postId on GET /posts/:postId
                      content:
                        type: string
                        description: Comment text
                        example: 'With measles outbreaks rising around the world, catching cases early makes a huge difference.


                          Thats why the first-ever rapid test for measles is such welcome news. By giving health workers an opportunity to confirm cases without a lab, they can respond sooner and help prevent…'
                      published:
                        type: string
                        format: date-time
                        example: '2026-10-18T01:06:22.648Z'
                        description: Publication date in ISO 8601 format
                      likeCount:
                        type: integer
                        description: Number of likes
                        example: 430
                      replyCount:
                        type: integer
                        example: 67
                        description: Number of replies
                      attributedTo:
                        type: object
                        properties:
                          type:
                            type: string
                            description: ActivityStreams object type
                            example: Person
                          id:
                            type: string
                            format: uri
                            example: https://www.linkedin.com/in/williamhgates
                            description: Author profile URL (stable identifier)
                          url:
                            type: string
                            format: uri
                            example: https://www.linkedin.com/in/williamhgates
                            description: Author profile URL
                          name:
                            type: string
                            example: Bill Gates
                            description: Author display name
                          preferredUsername:
                            type: string
                            example: williamhgates
                            description: Author username — looks the author up via GET /users/:username
                          followerCount:
                            type: integer
                            example: 40733856
                            description: Author follower count
                          icon:
                            allOf:
                            - $ref: '#/components/schemas/LinkedInImage'
                            - description: Author avatar
                        required:
                        - type
                        description: Post author
                      image:
                        type: array
                        items:
                          allOf:
                          - $ref: '#/components/schemas/LinkedInImage'
                          - description: Image resource
                        description: Thumbnail images
                        example:
                        - type: Image
                          url: https://media.licdn.com/dms/image/v2/D4E05AQGnh5Qo2aZfGw/videocover-high/B4EZ9nRqAzJEBM-/0/1784144110876
                      attachment:
                        type: array
                        items:
                          anyOf:
                          - $ref: '#/components/schemas/LinkedInVideoAttachment'
                          - $ref: '#/components/schemas/LinkedInCaptionLink'
                        description: Video attachment and caption file, when present
                        example:
                        - type: Video
                          url:
                          - https://dms.licdn.com/playlist/vid/v2/D4E05AQGnh5Qo2aZfGw/mp4-720p-30fp-crf28/B4EZ9nRqAzJEB8-/0/1784144111064
                          mediaType: video/mp4
                          duration: 4
                          preview:
                            type: Image
                            url: https://media.licdn.com/dms/image/v2/D4E05AQGnh5Qo2aZfGw/videocover-high/B4EZ9nRqAzJEBM-/0/1784144110876
                      replies:
                        type: array
                        items:
                          $ref: '#/components/schemas/LinkedInComment'
                        description: Inline comments — LinkedIn shows at most ~5 here; this is not the full thread
                    required:
                    - '@context'
                    - type
                    - id
                    - url
                    - content
                required:
                - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/CreditsExhaustedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PlatformError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/PlatformTimeoutError'
  /v1/linkedin/posts/{postId}/transcript:
    get:
      operationId: linkedinGetPostTranscript
      tags:
      - Linked In
      summary: Get post video transcript
      description: Returns the caption/transcript for a video post, when the post carries captions. Returns 404 if the post has no video or no captions.
      parameters:
      - schema:
          type: string
          description: 'LinkedIn post activity ID: the full slug (from linkedin.com/posts/{id}), a bare `urn:li:activity:{id}` (from linkedin.com/feed/update/{urn}/), or a bare numeric activity ID (e.g. `7517390588447621121`)'
          example: williamhgates_we-can-meaningfully-electrify-a-lot-of-transportation-activity-7516514827247448065-O_vw
        required: true
        description: 'LinkedIn post activity ID: the full slug (from linkedin.com/posts/{id}), a bare `urn:li:activity:{id}` (from linkedin.com/feed/update/{urn}/), or a bare numeric activity ID (e.g. `7517390588447621121`)'
        name: postId
        in: path
      responses:
        '200':
          description: Returns the transcript in Document format or raw caption content (WebVTT or SRT, matching the source)
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      type:
                        type: string
                        description: ActivityStreams object type
                        example: Document
                      id:
                        type: string
                        format: uri
                        description: Transcript permalink
                        example: https://www.linkedin.com/posts/williamhgates_we-can-meaningfully-electrify-a-lot-of-transportation-activity-7516514827247448065-O_vw/transcript
                      url:
                        type: string
                        format: uri
                        description: Post permalink
                        example: https://www.linkedin.com/posts/williamhgates_we-can-meaningfully-electrify-a-lot-of-transportation-activity-7516514827247448065-O_vw
                      mediaType:
                        type: string
                        description: MIME type as LinkedIn serves it for this caption track — either text/vtt (WebVTT) or application/x-subrip (SRT)
                        example: text/vtt
                      size:
                        type: integer
                        example: 1710
                        description: File size in bytes
                      content:
                        type: string
                        description: Transcript/caption content, in whatever format mediaType names
                        example: 'WEBVTT


                          00:00:00.320 --> 00:00:03.952

                          If you look at transportation as a category, the biggest


                          00:00:03.952 --> 00:00:07.265

                          part of that is passenger cars, and it''s clear that'
                    required:
                    - '@context'
                    - type
                    - id
                    - url
                    - mediaType
                    - content
                required:
                - data
            text/vtt:
              schema:
                type: string
                example: 'WEBVTT


                  00:00:00.320 --> 00:00:03.952

                  If you look at transportation as a category, the biggest


                  00:00:03.952 --> 00:00:07.265

                  part of that is passenger cars, and it''s clear that'
            application/x-subrip:
              schema:
                type: string
                example: '1

                  00:00:00,320 --> 00:00:03,952

                  If you look at transportation as a category, the biggest


                  2

                  00:00:03,952 --> 00:00:07,265

                  part of that is passenger cars, and it''s clear that'
        '400':
