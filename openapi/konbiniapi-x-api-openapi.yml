  /v1/x/users/{username}/posts:
    get:
      operationId: xGetUserPosts
      tags:
      - X
      summary: Get user posts
      description: 'Returns public posts from a user''s profile as visible to not logged in users. This feed is not guaranteed to be chronological and is often a ranked public selection. Pages may overlap: a pinned post is repeated on every page, so deduplicate by id when paging.'
      parameters:
      - schema:
          type: string
          description: X username (with or without @ symbol)
          example: Austen
        required: true
        description: X username (with or without @ symbol)
        name: username
        in: path
      - schema:
          type: string
          description: Pagination cursor
          example: '0'
        required: false
        description: Pagination cursor
        name: cursor
        in: query
      responses:
        '200':
          description: Returns public posts from an X user profile
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
