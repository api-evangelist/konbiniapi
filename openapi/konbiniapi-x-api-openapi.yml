components:
  schemas:
    XLink:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Link
        href:
          type: string
          format: uri
          description: Link URL
          example: https://t.co/examplelink
        rel:
          type: string
          description: Link relation hint
          example: preferred
      required:
      - type
      - href
      description: External link
    XImage:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Image
        url:
          type: string
          format: uri
          description: Image URL
          example: https://pbs.twimg.com/amplify_video_thumb/2024515147692195840/img/t8ePmit3Wst1hxAM.jpg
        width:
          type: integer
          description: Width in pixels
          example: 1536
        height:
          type: integer
          description: Height in pixels
          example: 2048
      required:
      - type
      - url
      description: Profile picture
    XPost:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Note
        id:
          type: string
          format: uri
          description: Post permalink
          example: https://x.com/KhabyLame/status/2024515585569083437
        url:
          type: string
          format: uri
          description: Post permalink
          example: https://x.com/KhabyLame/status/2024515585569083437
        entityId:
          type: string
          description: X post ID
          example: '2024515585569083437'
        content:
          type: string
          description: Comment text
          example: This man hasn't been in my fyp for so long
        published:
          type: string
          format: date-time
          description: Publication date in ISO 8601 format
          example: '2026-02-27T20:37:38.000Z'
        likeCount:
          type: integer
          description: Number of likes
          example: 93210
        replyCount:
          type: integer
          description: Number of replies
          example: 96
        viewCount:
          type: integer
          description: Number of views
          example: 10195
        repostCount:
          type: integer
          description: Number of reposts/retweets
          example: 3
        quoteCount:
          type: integer
          description: Number of quote posts
          example: 0
        saveCount:
          type: integer
          description: Number of saves/bookmarks
          example: 3
        contentFormat:
          type: string
          description: Content format (`post` for regular posts, `longform` for longer posts)
          example: longform
        isEdited:
          type: boolean
          description: Whether the post has been edited
          example: false
        attributedTo:
          $ref: '#/components/schemas/XEmbeddedUser'
        inReplyTo:
          type: string
          format: uri
          description: URL of parent content
          example: https://x.com/NISMO/status/2024100000000000000
        quote:
          $ref: '#/components/schemas/XQuotedPost'
        image:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/XImage'
            - description: Image resource with optional dimensions
          description: Primary images and thumbnails
        attachment:
          type: array
          items:
            $ref: '#/components/schemas/XPostAttachment'
          description: Media, poll, and preview attachments
        tag:
          type: array
          items:
            $ref: '#/components/schemas/XTag'
          description: Hashtags and mentions
      required:
      - type
      - id
      - url
      - entityId
      - content
      - likeCount
      description: X post
    XEmbeddedUser:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Person
        id:
          type: string
          format: uri
          description: Profile URL
          example: https://x.com/KhabyLame
        url:
          type: string
          format: uri
          description: Profile URL
          example: https://x.com/KhabyLame
        entityId:
          type: string
          description: X user ID
          example: '221838349'
        preferredUsername:
          type: string
          description: Username or handle
          example: KhabyLame
        name:
          type: string
          description: Display name
          example: Khabane Lame
        icon:
          $ref: '#/components/schemas/XImage'
        isPrivate:
          type: boolean
          description: Whether account is protected
          example: false
        isVerified:
          type: boolean
          description: Whether account has legacy verification
          example: false
        isPaidVerified:
          type: boolean
          description: Whether account has X Premium verification
          example: true
        summary:
          type: string
          description: Bio text
          example: Let's Go
        attachment:
          type: array
          items:
            $ref: '#/components/schemas/XLink'
          description: Profile links
        followerCount:
          type: integer
          description: Number of followers
          example: 372131
        followingCount:
          type: integer
          description: Number of accounts followed
          example: 8
        likeCount:
          type: integer
          description: Number of likes made by the user
          example: 60
        postCount:
          type: integer
          description: Number of public posts
          example: 267
        mediaCount:
          type: integer
          description: Number of media posts
          example: 242
        listedCount:
          type: integer
          description: Number of public X Lists the account appears in
          example: 215
        location:
          type: string
          description: User location
          example: Milan, Italy
      required:
      - type
      - id
      - url
      description: Post author
    XQuotedPost:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Note
        id:
          type: string
          format: uri
          description: Quoted post permalink
          example: https://x.com/NISMO/status/2024100000000000000
        url:
          type: string
          format: uri
          description: Quoted post permalink
          example: https://x.com/NISMO/status/2024100000000000000
        entityId:
          type: string
          description: Quoted X post ID
          example: '2024100000000000000'
        content:
          type: string
          description: Comment text
          example: Ready for race week.
        published:
          type: string
          format: date-time
          description: Publication date in ISO 8601 format
          example: '2026-02-18T12:00:00.000Z'
        likeCount:
          type: integer
          description: Number of likes
          example: 93210
        replyCount:
          type: integer
          description: Number of replies
          example: 96
        contentFormat:
          type: string
          description: Content format (`post` for regular posts, `longform` for longer posts)
          example: longform
        attributedTo:
          allOf:
          - $ref: '#/components/schemas/XEmbeddedUser'
          - description: Compact X profile for embedded contexts
          description: Quoted post author
        image:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/XImage'
            - description: Image resource with optional dimensions
          description: Primary images and thumbnails
        attachment:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/XAttachment'
            - $ref: '#/components/schemas/XLinkAttachment'
            - $ref: '#/components/schemas/XArticleAttachment'
            - $ref: '#/components/schemas/XPollAttachment'
          description: Quoted post attachments
      required:
      - type
      - id
      - url
      - entityId
      - content
      - likeCount
      description: Quoted post
    XAttachment:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Video
        url:
          type: array
          items:
            type: string
            format: uri
          description: Media download URLs
          example:
          - https://video.twimg.com/ext_tw_video/123/pu/vid/avc1/example.mp4
        mediaType:
          type: string
          description: MIME type
          example: video/mp4
        width:
          type: integer
          description: Width in pixels
          example: 1280
        height:
          type: integer
          description: Height in pixels
          example: 720
        bitrate:
          type: integer
          description: Bitrate in bits per second
          example: 950000
        duration:
          type: number
          description: Duration in seconds
          example: 16.266
      required:
      - type
      - url
      description: Post media attachment
    XLinkAttachment:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Link
        href:
          type: string
          format: uri
          description: Preview URL
          example: https://www.formulae.com/en/latest/article/nissan-and-khaby-lame-share-the-track-in-jeddah.3xexample
        name:
          type: string
          description: Preview title
          example: Nissan and Khaby Lame share the track in Jeddah
        summary:
          type: string
          description: Preview description
          example: A quick recap from Formula E race week in Jeddah.
        image:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/XImage'
            - description: Image resource with optional dimensions
          description: Preview images
      required:
      - type
      - href
      description: Link preview attachment
    XArticleAttachment:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Article
        entityId:
          type: string
          description: X article ID
          example: '1971521477247789275'
        url:
          type: string
          format: uri
          description: Article URL
          example: https://www.formulae.com/en/latest/article/nissan-and-khaby-lame-share-the-track-in-jeddah.3xexample
        name:
          type: string
          description: Article title
          example: Nissan and Khaby Lame share the track in Jeddah
        summary:
          type: string
          description: Article preview text
          example: A quick recap from Formula E race week in Jeddah.
        image:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/XImage'
            - description: Image resource with optional dimensions
          description: Article cover images
      required:
      - type
      description: Article preview attachment
    XPollAttachment:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Question
        oneOf:
          type: array
          items:
            $ref: '#/components/schemas/XPollOption'
          minItems: 2
          description: Poll options
        voterCount:
          type: integer
          description: Total number of votes
          example: 194
        closed:
          type: string
          format: date-time
          description: Poll closing time in ISO 8601 format
          example: '2026-02-20T16:05:03.000Z'
      required:
      - type
      - oneOf
      description: Poll attachment
    XPollOption:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Note
        name:
          type: string
          description: Poll option label
          example: Nissan Formula E car
        voteCount:
          type: integer
          description: Number of votes for this option
          example: 128
      required:
      - type
      - name
      description: Poll option
    XPostAttachment:
      anyOf:
      - $ref: '#/components/schemas/XAttachment'
      - $ref: '#/components/schemas/XLinkAttachment'
      - $ref: '#/components/schemas/XArticleAttachment'
      - $ref: '#/components/schemas/XPollAttachment'
      description: Post attachment
    XTag:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Tag
        name:
          type: string
          description: Tag name
          example: learnfromkhaby
        href:
          type: string
          format: uri
          description: Tag or mention URL
          example: https://x.com/hashtag/learnfromkhaby
      required:
      - type
      - name
      description: Hashtag or user mention
    XCommunityRule:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Document
        entityId:
          type: string
          description: Platform-specific rule ID
          example: '1848458992051159411'
        name:
          type: string
          description: Rule title
          example: Post memes only
        content:
          type: string
          description: Rule description
          example: Posts should be memes. No unrelated content or spam.
      required:
      - type
      - name
      description: Community rule
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: 'Send your API key in the Authorization header as a Bearer token.

        Example: `Authorization: Bearer <your-api-key>`'
