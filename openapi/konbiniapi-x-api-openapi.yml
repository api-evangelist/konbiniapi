openapi: 3.2.0
info:
  title: Konbini X API
  version: 1.0.0
  description: 'Social media API that normalizes TikTok, Instagram, YouTube, Reddit, X, and LinkedIn data into a consistent ActivityStreams 2.0 format.


    Every authenticated response includes `X-Credits-Remaining` and `X-Credits-Used` headers. Each successful request costs 1 credit. Requests that fail with 400, 5xx, or upstream errors are refunded (X-Credits-Used: 0).'
  contact:
    name: KonbiniAPI
    email: hello@konbiniapi.com
    url: https://konbiniapi.com
servers:
- url: https://api.konbiniapi.com
  description: Production
security:
- apiKey: []
tags:
- name: X
  description: X data endpoints
paths:
  /v1/x/users/{username}:
    get:
      operationId: xGetUser
      tags:
      - X
      summary: Get user profile
      description: Returns profile information for a public X account including bio, follower counts, verification flags, and profile images.
      parameters:
      - schema:
          type: string
          description: X username (with or without @ symbol)
          example: elonmusk
        required: true
        description: X username (with or without @ symbol)
        name: username
        in: path
      responses:
        '200':
          description: Returns the X user profile
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      affiliation:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Affiliated organization
                          url:
                            type: string
                            format: uri
                            description: Its profile URL
                          icon:
                            $ref: '#/components/schemas/XImage'
                        required:
                        - name
                        description: The organization X shows beside the handle
                        example:
                          name: NASA
                      withheldIn:
                        type: array
                        items:
                          type: string
                        description: Countries where the account is withheld
                        example:
                        - IN
                      type:
                        type: string
                        description: ActivityStreams object type
                        example: Person
                      id:
                        type: string
                        format: uri
                        description: Profile URL
                        example: https://x.com/elonmusk
                      url:
                        type: string
                        format: uri
                        description: Profile URL
                        example: https://x.com/elonmusk
                      entityId:
                        type: string
                        description: X user ID
                        example: '44196397'
                      name:
                        type: string
                        description: Display name
                        example: Elon Musk
                      preferredUsername:
                        type: string
                        description: Username or handle
                        example: elonmusk
                      summary:
                        type: string
                        example: https://t.co/ZdBx5WABYx
                        description: Bio text
                      attachment:
                        type: array
                        items:
                          $ref: '#/components/schemas/XLink'
                        description: Profile links
                      published:
                        type: string
                        format: date-time
                        example: '2009-06-02T20:12:29.000Z'
                        description: Account creation date in ISO 8601 format
                      isPrivate:
                        type: boolean
                        description: Whether account is protected
                        example: false
                      isVerified:
                        type: boolean
                        description: Whether X has verified the identity. Legacy verification was retired in 2023, so this now reflects the identity check.
                        example: false
                      isPaidVerified:
                        type: boolean
                        description: Whether account has X Premium verification
                        example: true
                      verifiedSince:
                        type: string
                        format: date-time
                        description: When X verified the identity
                        example: '2023-11-09T00:00:00.000Z'
                      followerCount:
                        type: integer
                        description: Number of followers
                        example: 241511977
                      followingCount:
                        type: integer
                        description: Number of accounts followed
                        example: 1420
                      likeCount:
                        type: integer
                        description: Number of likes made by the user
                        example: 253904
                      postCount:
                        type: integer
                        description: Number of public posts
                        example: 110457
                      mediaCount:
                        type: integer
                        description: Number of media posts
                        example: 4741
                      memberCount:
                        type: integer
                        description: Accounts affiliated with this business profile
                        example: 87
                      listedCount:
                        type: integer
                        example: 171022
                        description: Number of public X Lists the account appears in
                      language:
                        type: string
                        description: Language of the bio
                        example: en
                      category:
                        type: string
                        description: Creator category X assigns a professional account
                        example: Engineer
                      pinned:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - Note
                              example: Note
                            id:
                              type: string
                              example: https://x.com/elonmusk/status/2110913107094606330
                            url:
                              type: string
                              example: https://x.com/elonmusk/status/2110913107094606330
                            entityId:
                              type: string
                              description: Usable on /x/posts/{id}
                              example: '2110913107094606330'
                          required:
                          - type
                          - id
                          - url
                          - entityId
                        description: What this account pins to its profile
                      tag:
                        type: array
                        items:
                          $ref: '#/components/schemas/XTag'
                        description: Platform-assigned labels, e.g. a parody designation
                      location:
                        type: string
                        description: User location
                        example: Pretoria, South Africa
                      icon:
                        allOf:
                        - $ref: '#/components/schemas/XImage'
                        - description: Profile picture
                      image:
                        type: array
                        items:
                          allOf:
                          - $ref: '#/components/schemas/XImage'
                          - description: Image resource with optional dimensions
                        description: Banner image and other non-avatar profile images
                    required:
                    - '@context'
                    - type
                    - id
                    - url
                    - entityId
                    - name
                    - preferredUsername
                    - isPrivate
                    - isVerified
                    - isPaidVerified
                    - followerCount
                    - followingCount
                    - likeCount
                    - postCount
                    - mediaCount
                required:
                - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/CreditsExhaustedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PlatformError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/PlatformTimeoutError'
  /v1/x/users/{username}/posts:
    get:
      operationId: xGetUserPosts
      tags:
      - X
      summary: Get user posts
      description: 'Returns public posts from a user''s profile. This feed is not guaranteed to be chronological and is often a ranked public selection. Pages may overlap: a pinned post is repeated on every page, so deduplicate by id when paging.'
      parameters:
      - schema:
          type: string
          description: X username (with or without @ symbol)
          example: elonmusk
        required: true
        description: X username (with or without @ symbol)
        name: username
        in: path
      - schema:
          type: string
          description: Pagination cursor
          example: '0'
        required: false
        description: Pagination cursor
        name: cursor
        in: query
      responses:
        '200':
          description: Returns public posts from an X user profile
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      type:
                        type: string
                        description: ActivityStreams collection type
                        example: OrderedCollectionPage
                      partOf:
                        type: string
                        format: uri
                        description: URL of the full collection
                        example: https://api.konbiniapi.com/v1/x/users/elonmusk/posts
                      totalItems:
                        type:
                        - integer
                        - 'null'
                        description: Total number of items, null if unknown
                        example: null
                      cursor:
                        type:
                        - string
                        - 'null'
                        description: Current page cursor, null on first page
                        example: null
                      nextCursor:
                        type:
                        - string
                        - 'null'
                        description: Cursor for the next page, null on last page
                        example: DAABCgABHOkX2xF__-8LAAIAAAATMj
                      next:
                        type:
                        - string
                        - 'null'
                        format: uri
                        description: URL for the next page, null on last page
                        example: https://api.konbiniapi.com/v1/x/users/elonmusk/posts?cursor=DAABCgABHOkX2xF__-8LAAIAAAATMj
                      itemCount:
                        type: integer
                        description: Number of items returned in this page
                        example: 30
                      orderedItems:
                        type: array
                        items:
                          $ref: '#/components/schemas/XPost'
                        description: Items in this page
                    required:
                    - '@context'
                    - type
                    - partOf
                    - totalItems
                    - cursor
                    - nextCursor
                    - next
                    - itemCount
                    - orderedItems
                required:
                - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/CreditsExhaustedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PlatformError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/PlatformTimeoutError'
  /v1/x/users/{username}/highlights:
    get:
      operationId: xGetUserHighlights
      tags:
      - X
      summary: Get user highlights
      description: 'Returns the public selection on a user''s Highlights tab. This feed is not guaranteed to be chronological. Pages may overlap: a pinned post is repeated on every page, so deduplicate by id when paging.'
      parameters:
      - schema:
          type: string
          description: X username (with or without @ symbol)
          example: elonmusk
        required: true
        description: X username (with or without @ symbol)
        name: username
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 40
          description: 'Number of highlighted posts to return per page (maximum: 100)'
          example: 40
        required: false
        description: 'Number of highlighted posts to return per page (maximum: 100)'
        name: count
        in: query
      - schema:
          type: string
          description: Pagination cursor
          example: '0'
        required: false
        description: Pagination cursor
        name: cursor
        in: query
      responses:
        '200':
          description: Returns the public Highlights tab selection from an X user's profile
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      type:
                        type: string
                        description: ActivityStreams collection type
                        example: OrderedCollectionPage
                      partOf:
                        type: string
                        format: uri
                        description: URL of the full collection
                        example: https://api.konbiniapi.com/v1/x/users/elonmusk/highlights
                      totalItems:
                        type:
                        - integer
                        - 'null'
                        description: Total number of items, null if unknown
                        example: null
                      cursor:
                        type:
                        - string
                        - 'null'
                        description: Current page cursor, null on first page
                        example: null
                      nextCursor:
                        type:
                        - string
                        - 'null'
                        description: Cursor for the next page, null on last page
                        example: DAABCgABHOkX2xF__-8LAAIAAAATMj
                      next:
                        type:
                        - string
                        - 'null'
                        format: uri
                        description: URL for the next page, null on last page
                        example: https://api.konbiniapi.com/v1/x/users/elonmusk/highlights?cursor=DAABCgABHOkX2xF__-8LAAIAAAATMj&count=40
                      itemCount:
                        type: integer
                        description: Number of items returned in this page
                        example: 30
                      orderedItems:
                        type: array
                        items:
                          $ref: '#/components/schemas/XPost'
                        description: Items in this page
                    required:
                    - '@context'
                    - type
                    - partOf
                    - totalItems
                    - cursor
                    - nextCursor
                    - next
                    - itemCount
                    - orderedItems
                required:
                - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/CreditsExhaustedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PlatformError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/PlatformTimeoutError'
  /v1/x/posts/{postId}:
    get:
      operationId: xGetPost
      tags:
      - X
      summary: Get post
      description: Returns a public X post including text, author, engagement counts, and media attachments.
      parameters:
      - schema:
          type: string
          description: X post ID
          example: '2110913107094606330'
        required: true
        description: X post ID
        name: postId
        in: path
      responses:
        '200':
          description: Returns the X post
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      permission:
                        type: object
                        properties:
                          comment:
                            type: string
                            enum:
                            - everyone
                            - friends
                            - members
                            - mentioned
                            - 'off'
                            description: Who may reply
                        description: Who may act on this post
                        example:
                          comment: members
                      type:
                        type: string
                        description: ActivityStreams object type
                        example: Note
                      id:
                        type: string
                        format: uri
                        description: Post permalink
                        example: https://x.com/elonmusk/status/2110913107094606330
                      url:
                        type: string
                        format: uri
                        description: Post permalink
                        example: https://x.com/elonmusk/status/2110913107094606330
                      entityId:
                        type: string
                        description: X post ID
                        example: '2110913107094606330'
                      content:
                        type: string
                        description: Comment text
                        example: Turns out the future does have flying cars https://t.co/6fexPp6SXI
                      published:
                        type: string
                        format: date-time
                        example: '2026-10-16T01:57:58.000Z'
                        description: Publication date in ISO 8601 format
                      likeCount:
                        type: integer
                        description: Number of likes
                        example: 824681
                      replyCount:
                        type: integer
                        example: 46110
                        description: Number of replies
                      viewCount:
                        type: integer
                        example: 73268619
                        description: Number of views
                      repostCount:
                        type: integer
                        example: 99345
                        description: Number of reposts/retweets
                      quoteCount:
                        type: integer
                        example: 32050
                        description: Number of quote posts
                      saveCount:
                        type: integer
                        example: 63751
                        description: Number of saves/bookmarks
                      contentFormat:
                        type: string
                        example: post
                        description: Content format (`post` for regular posts, `longform` for longer posts)
                      language:
                        type: string
                        description: BCP-47 language of the post
                        example: en
                      isAdult:
                        type: boolean
                        description: Whether X marked the post as possibly sensitive
                        example: false
                      isEdited:
                        type: boolean
                        example: false
                        description: Whether the post has been edited
                      attributedTo:
                        $ref: '#/components/schemas/XEmbeddedUser'
                      inReplyTo:
                        type: string
                        format: uri
                        description: URL of parent content
                        example: https://x.com/elonmusk/status/1519480761749016577
                      context:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - Note
                            example: Note
                          id:
                            type: string
                            example: https://x.com/elonmusk/status/2110913107094606330
                          url:
                            type: string
                            example: https://x.com/elonmusk/status/2110913107094606330
                          entityId:
                            type: string
                            example: '2110913107094606330'
                        required:
                        - type
                        - id
                        - url
                        - entityId
                        description: The thread this post belongs to. entityId works on /x/posts/{id}.
                      audience:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - Group
                            example: Group
                          id:
                            type: string
                            example: https://x.com/i/communities/1669501013441806336
                          url:
                            type: string
                            example: https://x.com/i/communities/1669501013441806336
                          entityId:
                            type: string
                            description: Usable on /x/communities/{id}
                            example: '1669501013441806336'
                          name:
                            type: string
                            example: Memes
                        required:
                        - type
                        - id
                        - url
                        - entityId
                        description: The community the post was made in
                      quote:
                        $ref: '#/components/schemas/XQuotedPost'
                        description: Quoted post
                      image:
                        type: array
                        items:
                          allOf:
                          - $ref: '#/components/schemas/XImage'
                          - description: Image resource with optional dimensions
                        description: Primary images and thumbnails
                      attachment:
                        type: array
                        items:
                          $ref: '#/components/schemas/XPostAttachment'
                        description: Media, poll, and preview attachments
                      tag:
                        type: array
                        items:
                          $ref: '#/components/schemas/XTag'
                        description: Hashtags and mentions
                      generator:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - Application
                            example: Application
                          name:
                            type: string
                            example: Twitter for iPhone
                          url:
                            type: string
                            example: https://help.x.com/en/using-x/how-to-post
                        required:
                        - type
                        - name
                        description: The client the post was written with
                    required:
                    - '@context'
                    - type
                    - id
                    - url
                    - entityId
                    - content
                    - likeCount
                required:
                - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/CreditsExhaustedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/PlatformError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/PlatformTimeoutError'
  /v1/x/communities/{communityId}:
    get:
      operationId: xGetCommunity
      tags:
      - X
      summary: Get community
      description: Returns public metadata for an X community, including description, member count, topic, creator, and banner image.
      parameters:
      - schema:
          type: string
          description: X community ID
          example: '1669501013441806336'
        required: true
        description: X community ID
        name: communityId
        in: path
      responses:
        '200':
          description: Returns the X community detail
          headers:
            X-Credits-Remaining:
              schema:
                type: integer
              description: Credits remaining after this request
            X-Credits-Used:
              schema:
                type: integer
              description: Credits consumed (1 if charged, 0 if refunded on error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '@context':
                        type: array
                        prefixItems:
                        - type: string
                          enum:
                          - https://www.w3.org/ns/activitystreams#
                        - type: string
                          enum:
                          - https://konbiniapi.com/ns/social#
                        description: ActivityStreams JSON-LD context
                        example:
                        - https://www.w3.org/ns/activitystreams#
                        - https://konbiniapi.com/ns/social#
                      type:
                        type: string
                        description: ActivityStreams object type
                        example: Group
                      id:
                        type: string
                        format: uri
                        description: Community URL
                        example: https://x.com/i/communities/1669501013441806336
                      url:
                        type: string
                        format: uri
                        description: Community URL
                        example: https://x.com/i/communities/1669501013441806336
                      entityId:
                        type: string
                        description: X community ID
                        example: '1669501013441806336'
                      name:
                        type: string
                        description: Community name
                        example: Memes
                      summary:
                        type: string
                        example: Post the funniest memes you can find!
                        description: Community description
                      published:
                        type: string
                        format: date-time
                        example: '2023-06-16T00:23:54.093Z'
                        description: Community creation date in ISO 8601 format
                      access:
                        type: string
                        enum:
                        - open
                        - restricted
                        - private
                        description: Who may take part. Shared with Reddit subreddits.
                        example: open
                      isAdult:
                        type: boolean
                        description: Whether the community is marked NSFW
                        example: false
                      memberCount:
                        type: integer
                        example: 517200
                        description: Number of community members
                      category:
                        type: string
                        example: Entertainment
                        description: Primary community topic
                      tag:
                        type: array
                        items:
                          $ref: '#/components/schemas/XTag'
                        description: Trending hashtags associated with the community
                      rule:
                        type: array
                        items:
                          $ref: '#/components/schemas/XCommunityRule'
                        description: Community rules
                      attributedTo:
                        allOf:
                        - $ref: '#/components/schemas/XEmbeddedUser'
                        - description: Compact X profile for embedded contexts
                        description: Community creator
                      image:
                        type: array
                        items:
                          allOf:
                          - $ref: '#/components/schemas/XImage'
                          - description: Image resource with optional dimensions
                        description: Community banner images
                    required:
                    - '@context'
                    - type
                    - id
                    - url
                    - entityId
                    - name
                required:
                - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
