components:
  schemas:
    NotFoundError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                - not_found
                - route_not_found
                description: Machine-readable error code
              message:
                type: string
                example: Not found
                description: Human-readable error message
            required:
            - code
            - message
          description: List of errors
        data:
          type: 'null'
          description: Always null for error responses
      required:
      - errors
      - data
    ValidationError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                - validation_error
                description: Machine-readable error code
              message:
                type: string
                example: Validation error
                description: Human-readable error message
            required:
            - code
            - message
          description: List of errors
        data:
          type: 'null'
          description: Always null for error responses
      required:
      - errors
      - data
    PlatformError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                - platform_error
                description: Machine-readable error code
              message:
                type: string
                example: Platform error
                description: Human-readable error message
            required:
            - code
            - message
          description: List of errors
        data:
          type: 'null'
          description: Always null for error responses
      required:
      - errors
      - data
    XTag:
      anyOf:
      - $ref: '#/components/schemas/XHashtag'
      - $ref: '#/components/schemas/XMention'
      description: Hashtag or user mention
    XQuotedPost:
      type: object
      properties:
        permission:
          type: object
          properties:
            comment:
              type: string
              enum:
              - everyone
              - friends
              - members
              - mentioned
              - 'off'
              description: Who may reply
          description: Who may act on this post
          example:
            comment: members
        type:
          type: string
          description: ActivityStreams object type
          example: Note
        id:
          type: string
          format: uri
          description: Post permalink
          example: https://x.com/elonmusk/status/2110913107094606330
        url:
          type: string
          format: uri
          description: Post permalink
          example: https://x.com/elonmusk/status/2110913107094606330
        entityId:
          type: string
          description: X post ID
          example: '2110913107094606330'
        content:
          type: string
          description: Comment text
          example: Turns out the future does have flying cars https://t.co/6fexPp6SXI
        published:
          type: string
          format: date-time
          example: '2026-10-16T01:57:58.000Z'
          description: Publication date in ISO 8601 format
        likeCount:
          type: integer
          description: Number of likes
          example: 824681
        replyCount:
          type: integer
          example: 46110
          description: Number of replies
        viewCount:
          type: integer
          example: 73268619
          description: Number of views
        repostCount:
          type: integer
          example: 99345
          description: Number of reposts/retweets
        quoteCount:
          type: integer
          example: 32050
          description: Number of quote posts
        saveCount:
          type: integer
          example: 63751
          description: Number of saves/bookmarks
        contentFormat:
          type: string
          example: post
          description: Content format (`post` for regular posts, `longform` for longer posts)
        language:
          type: string
          description: BCP-47 language of the post
          example: en
        isAdult:
          type: boolean
          description: Whether X marked the post as possibly sensitive
          example: false
        isEdited:
          type: boolean
          example: false
          description: Whether the post has been edited
        attributedTo:
          $ref: '#/components/schemas/XEmbeddedUser'
        inReplyTo:
          type: string
          format: uri
          description: URL of parent content
          example: https://x.com/elonmusk/status/1519480761749016577
        context:
          type: object
          properties:
            type:
              type: string
              enum:
              - Note
              example: Note
            id:
              type: string
              example: https://x.com/elonmusk/status/2110913107094606330
            url:
              type: string
              example: https://x.com/elonmusk/status/2110913107094606330
            entityId:
              type: string
              example: '2110913107094606330'
          required:
          - type
          - id
          - url
          - entityId
          description: The thread this post belongs to. entityId works on /x/posts/{id}.
        audience:
          type: object
          properties:
            type:
              type: string
              enum:
              - Group
              example: Group
            id:
              type: string
              example: https://x.com/i/communities/1669501013441806336
            url:
              type: string
              example: https://x.com/i/communities/1669501013441806336
            entityId:
              type: string
              description: Usable on /x/communities/{id}
              example: '1669501013441806336'
            name:
              type: string
              example: Memes
          required:
          - type
          - id
          - url
          - entityId
          description: The community the post was made in
        image:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/XImage'
            - description: Image resource with optional dimensions
          description: Primary images and thumbnails
        attachment:
          type: array
          items:
            $ref: '#/components/schemas/XPostAttachment'
          description: Media, poll, and preview attachments
        tag:
          type: array
          items:
            $ref: '#/components/schemas/XTag'
          description: Hashtags and mentions
        generator:
          type: object
          properties:
            type:
              type: string
              enum:
              - Application
              example: Application
            name:
              type: string
              example: Twitter for iPhone
            url:
              type: string
              example: https://help.x.com/en/using-x/how-to-post
          required:
          - type
          - name
          description: The client the post was written with
      required:
      - type
      - id
      - url
      - entityId
      - content
      - likeCount
      description: Quoted post
    XImage:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Image
        url:
          type: string
          format: uri
          description: Image URL
          example: https://pbs.twimg.com/amplify_video_thumb/2110913027490934784/img/Ya3Xqn9K4XmCb-h5.jpg
        name:
          type: string
          description: Publisher title for the media
          example: Starship lifting off
        summary:
          type: string
          description: Alt text, or the publisher's synopsis
          example: Starship on the launch pad at Starbase
        status:
          type: string
          description: Why the media is unavailable, when it is
          example: Dmcaed
        tag:
          type: array
          items:
            $ref: '#/components/schemas/XTag'
          description: Accounts tagged in the media
        width:
          type: integer
          example: 1920
          description: Width in pixels
        height:
          type: integer
          example: 1080
          description: Height in pixels
      required:
      - type
      - url
      description: Its badge
    XAttachment:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Video
        url:
          type: array
          items:
            type: string
            format: uri
            example: https://video.twimg.com/amplify_video/2110913027490934784/vid/avc1/480x270/-5TS0Hah7_RnCNYX.mp4?tag=29
          description: Media download URLs
        mediaType:
          type: string
          example: video/mp4
          description: MIME type
        width:
          type: integer
          example: 1920
          description: Width in pixels
        height:
          type: integer
          example: 1080
          description: Height in pixels
        name:
          type: string
          description: Publisher title for the media
          example: Starship lifting off
        summary:
          type: string
          description: Alt text, or the publisher's synopsis
          example: Starship on the launch pad at Starbase
        status:
          type: string
          description: Why the media is unavailable, when it is
          example: Dmcaed
        tag:
          type: array
          items:
            $ref: '#/components/schemas/XTag'
          description: Accounts tagged in the media
        bitrate:
          type: integer
          example: 10368000
          description: Bitrate in bits per second
        duration:
          type: number
          example: 15.395
          description: Duration in seconds
      required:
      - type
      - url
      description: Post media attachment
    XPollOption:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Note
        name:
          type: string
          description: Poll option label
          example: Starship
        voteCount:
          type: integer
          description: Number of votes for this option
          example: 128
      required:
      - type
      - name
      description: Poll option
    PlatformTimeoutError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                - platform_error
                description: Machine-readable error code
              message:
                type: string
                example: Platform error
                description: Human-readable error message
            required:
            - code
            - message
          description: List of errors
        data:
          type: 'null'
          description: Always null for error responses
      required:
      - errors
      - data
    XCommunityRule:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Document
        entityId:
          type: string
          example: '1848458992051159411'
          description: Platform-specific rule ID
        name:
          type: string
          description: Rule title
          example: Post MEMES only
        content:
          type: string
          description: Rule description
          example: Posts should be memes. No unrelated content or spam.
      required:
      - type
      - name
      description: Community rule
    XLink:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Link
        href:
          type: string
          format: uri
          description: Link URL
          example: http://Terafab.AI
        rel:
          type: string
          description: Link relation hint
          example: preferred
      required:
      - type
      - href
      description: External link
    PayloadTooLargeError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                - validation_error
                description: Machine-readable error code
              message:
                type: string
                example: Request body too large
                description: Human-readable error message
            required:
            - code
            - message
          description: List of errors
        data:
          type: 'null'
          description: Always null for error responses
      required:
      - errors
      - data
    XHashtag:
      type: object
      properties:
        type:
          type: string
          enum:
          - Tag
          description: ActivityStreams object type
          example: Tag
        name:
          type: string
          description: Tag name
          example: Starship
        href:
          type: string
          format: uri
          example: https://x.com/hashtag/Starship
          description: Tag URL
        startIndex:
          type: integer
          description: Where the entity starts in `content`, counted in Unicode codepoints (not UTF-16 code units). In a UTF-16 language such as JavaScript, slice with `[...content].slice(startIndex, endIndex)` rather than `content.slice(...)`, which is off by one per emoji before it.
          example: 3
        endIndex:
          type: integer
          description: Where the entity ends in `content`, exclusive, counted in Unicode codepoints. See `startIndex`.
          example: 7
      required:
      - type
      - name
      description: Hashtag
    XPostAttachment:
      anyOf:
      - $ref: '#/components/schemas/XAttachment'
      - $ref: '#/components/schemas/XLinkAttachment'
      - $ref: '#/components/schemas/XArticleAttachment'
