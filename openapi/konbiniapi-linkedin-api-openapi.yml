            name:
              type: string
              description: Author display name
              example: Jane Doe
            preferredUsername:
              type: string
              description: Author username — looks the author up via GET /users/:username
              example: janedoe
            followerCount:
              type: integer
              description: Author follower count
              example: 12000
          required:
          - type
          description: Comment author
          example:
