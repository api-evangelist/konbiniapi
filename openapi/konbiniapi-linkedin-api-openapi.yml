components:
  schemas:
    LinkedInAddress:
      type: object
      properties:
        streetAddress:
          type: string
          example: One Market Street
        addressLocality:
          type: string
          example: San Francisco
        addressRegion:
          type: string
          example: CA
        postalCode:
          type: string
          example: '94105'
        addressCountry:
          type: string
          example: US
      description: Structured postal address
      example:
        addressLocality: United States
        addressCountry: US
    LinkedInImage:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Image
        url:
          type: string
          format: uri
          description: Image URL
          example: https://media.licdn.com/dms/image/v2/D4E03AQExample/profile-displayphoto-shrink_800_800/0/1700000000000
      required:
      - type
      - url
      description: Profile picture
    LinkedInArticle:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Article
        url:
          type: string
          format: uri
          description: Article URL
          example: https://www.linkedin.com/pulse/can-you-outsource-taste-reid-hoffman-qcu3c
        name:
          type: string
          description: Article title
          example: Can you outsource taste?
        image:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/LinkedInImage'
            - description: Image resource
          description: Article cover images
          example:
          - type: Image
            url: https://media.licdn.com/dms/image/v2/D5612AQF6uHExWXPl8Q/article-cover_image-shrink_720_1280/B56Z.u3RNSLAAQ-/0/1785345152512
        likeCount:
          type: integer
          description: Number of likes
          example: 257
        attributedTo:
          type: object
          properties:
            type:
              type: string
              description: ActivityStreams object type
              example: Person
            id:
              type: string
              format: uri
              description: Author profile URL (stable identifier)
              example: https://www.linkedin.com/in/janedoe
            url:
              type: string
              format: uri
              description: Author profile URL
              example: https://www.linkedin.com/in/janedoe
            name:
              type: string
              description: Author display name
              example: Jane Doe
            preferredUsername:
              type: string
              description: Author username — looks the author up via GET /users/:username
              example: janedoe
            followerCount:
              type: integer
              description: Author follower count
              example: 12000
          required:
          - type
          description: Article author
          example:
            type: Person
            id: https://www.linkedin.com/in/reidhoffman
            url: https://www.linkedin.com/in/reidhoffman
            name: Reid Hoffman
            preferredUsername: reidhoffman
            followerCount: 2783366
      required:
      - type
      description: Published LinkedIn article
    LinkedInRecentPost:
      type: object
      properties:
        type:
          type: string
          description: ActivityStreams object type
          example: Note
        id:
          type: string
          format: uri
          description: Post permalink (mirrors `url`, when present)
          example: https://www.linkedin.com/posts/reidhoffman_blake-scholl-is-leading-the-rebirth-of-american-activity-7486053762244079616-zWLl
        url:
          type: string
          format: uri
          description: Post URL
          example: https://www.linkedin.com/posts/reidhoffman_blake-scholl-is-leading-the-rebirth-of-american-activity-7486053762244079616-zWLl
        entityId:
          type: string
          description: Numeric activity ID, usable directly as :postId on GET /posts/:postId
          example: '7486053762244079616'
        content:
          type: string
          description: Comment text
          example: 'Blake Scholl is leading the rebirth of American Aerospace, powered by AI. He told me something that sounds like the nightmare scenario for AI and jobs: a thousand-person engine team reduced to two people.'
        published:
          type: string
          format: date-time
          description: Publication date in ISO 8601 format
          example: '2026-07-23T13:45:01.045Z'
        likeCount:
          type: integer
          description: Number of likes
          example: 191
        attributedTo:
          type: object
