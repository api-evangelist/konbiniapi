note: >-
  KonbiniAPI does NOT use RFC 9457 problem+json. Every error response — on all 67 operations — is
  application/json carrying the same vendor envelope: an `errors` array of
  {code, message} objects plus a null `data` field. The `code` value is the machine-readable
  identifier; there is no `type` URI, `title`, `status`, `detail` or `instance` member. The catalog
  below is the provider's own published error reference, cross-checked against the 4xx/5xx responses
  declared on every operation in the live OpenAPI, and against live 401/404 responses observed on
  api.konbiniapi.com during this pass.
envelope:
  media_type: application/json
  shape: |-
    {
      "errors": [
        { "code": "not_found", "message": "User not found" }
      ],
      "data": null
    }
  fields:
    - name: errors
      type: array
      description: One or more error objects. Present only on failure.
    - name: errors[].code
      type: string
      description: Machine-readable error code. Switch on this, never on the message.
    - name: errors[].message
      type: string
      description: Human-readable explanation. Wording is not part of the contract.
    - name: data
      type: 'null'
      description: Always null on an error response; carries the payload on success.
