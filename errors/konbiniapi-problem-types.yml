  - code: platform_error
    status: 502
    category: upstream
    title: Upstream platform error
    detail: The upstream social platform (Instagram, TikTok, X, Reddit or LinkedIn) failed or refused the fetch.
    remediation: Retry with backoff. Refunded — X-Credits-Used is 0.
    credits_charged: 0
    retryable: true
  - code: service_unavailable
    status: 503
    category: server
    title: API temporarily unavailable
    detail: KonbiniAPI is temporarily unable to serve the request.
    remediation: Retry with exponential backoff. Refunded.
