  - code: invalid_api_key
    status: 401
    category: authentication
    title: API key does not exist
    detail: The presented key is not recognised. Revoked keys are rejected instantly.
    remediation: Re-issue or rotate the key from the dashboard. Credits stay with the account, not the key.
    credits_charged: 0
  - code: api_key_disabled
    status: 403
    category: authorization
    title: API key has been disabled
    detail: The key exists but has been disabled on the account.
    remediation: Re-enable or rotate the key at https://app.konbiniapi.com.
    credits_charged: 0
  - code: api_key_expired
    status: 403
    category: authorization
    title: API key has expired
    detail: The key exists but is past its expiry.
    remediation: Issue a new key at https://app.konbiniapi.com.
    credits_charged: 0
  - code: credits_exhausted
    status: 402
    category: billing
    title: No credits remaining
    detail: >-
      The account's credit balance has reached zero. Requests hard-stop by default; paid plans may
      opt into extra usage beyond the plan allowance instead of stopping.
    remediation: >-
      Upgrade the plan or enable extra usage at https://app.konbiniapi.com, or wait for the next
      billing cycle. This is the primary quota signal — KonbiniAPI publishes no rate limit and
      returns no 429.
    credits_charged: 0
    agent_note: >-
      An agent should treat 402 as terminal for the current run, not as a retryable backoff. Retrying
      will not succeed until a human changes the plan.
  - code: validation_error
    status: 400
    category: request
    title: Invalid parameters
    detail: One or more query, path or body parameters failed validation.
    remediation: Correct the parameter and retry. Refunded — a 400 costs 0 credits.
    credits_charged: 0
  - code: not_found
    status: 404
    category: request
    title: Resource not found
    detail: >-
      The requested profile, post, video, comment, subreddit, community or audio does not exist, is
      private, or is not publicly visible. Also returned when a TikTok user is not currently live.
    remediation: Verify the identifier. This is a legitimate empty result, not a fault.
    credits_charged: 1
  - code: route_not_found
    status: 404
    category: request
    title: Endpoint does not exist
    detail: The path is not a KonbiniAPI route.
    remediation: Check the path against the OpenAPI. Base is https://api.konbiniapi.com with a /v1 prefix.
    credits_charged: 0
    observed:
