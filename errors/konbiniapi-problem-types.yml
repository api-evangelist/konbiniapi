  - code: missing_api_key
    status: 401
    category: authentication
    title: Missing or malformed API key
    detail: The Authorization header is absent or is not a well-formed `Bearer knbn_...` value.
    remediation: >-
      Send `Authorization: Bearer <your-api-key>`. Keys are issued at https://app.konbiniapi.com and
      carry the `knbn_` prefix.
    credits_charged: 0
