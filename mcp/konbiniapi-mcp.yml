tools:
- name: instagram_get_highlight_stories
  platform: Instagram
  rest: GET /v1/instagram/highlights/{highlightId}
  result_type: Collection tool
  description: Returns all story items within a highlight reel, including images and videos. The highlight ID comes from the highlights list endpoint.
  docs: https://docs.konbiniapi.com/reference/mcp/tools/instagram/get-highlight-stories
- name: instagram_get_location_posts
  platform: Instagram
  rest: GET /v1/instagram/locations/{locationId}
  result_type: Collection tool
  description: Returns recent posts tagged at a location. Fixed page size of 21 (platform limit). The location ID is a numeric Facebook Places ID.
  docs: https://docs.konbiniapi.com/reference/mcp/tools/instagram/get-location-posts
- name: instagram_get_post
  platform: Instagram
  rest: GET /v1/instagram/posts/{postId}
  result_type: Detail tool
  description: Returns details for a single post by its shortcode, including media, captions, and engagement counts. Supports photos, videos, and carousels.
  docs: https://docs.konbiniapi.com/reference/mcp/tools/instagram/get-post
- name: instagram_get_post_comments
  platform: Instagram
  rest: GET /v1/instagram/posts/{postId}/comments
  result_type: Collection tool
  description: Returns top-level comments on an Instagram post. Fixed page size of 15 (platform limit). Includes comment text, author info, like counts, and timestamps.
  docs: https://docs.konbiniapi.com/reference/mcp/tools/instagram/get-post-comments
- name: instagram_get_user
  platform: Instagram
  rest: GET /v1/instagram/users/{username}
  result_type: Detail tool
  description: Returns profile information for an Instagram user including bio, follower counts, profile picture, and account metadata. Look up any public Instagram account by username.
  docs: https://docs.konbiniapi.com/reference/mcp/tools/instagram/get-user
- name: instagram_get_user_highlights
  platform: Instagram
  rest: GET /v1/instagram/users/{username}/highlights
  result_type: Collection tool
  description: Returns the list of story highlight reels on a user's profile. Use the highlight endpoint to get individual stories within a highlight.
  docs: https://docs.konbiniapi.com/reference/mcp/tools/instagram/get-user-highlights
- name: instagram_get_user_posts
  platform: Instagram
  rest: GET /v1/instagram/users/{username}/posts
  result_type: Collection tool
  description: Returns a paginated list of posts from an Instagram user's profile feed. Maximum 12 posts per page. Includes photos, videos, carousels, and engagement counts.
  docs: https://docs.konbiniapi.com/reference/mcp/tools/instagram/get-user-posts
- name: instagram_get_user_reels
  platform: Instagram
  rest: GET /v1/instagram/users/{username}/reels
  result_type: Collection tool
  description: Returns a paginated list of reels from an Instagram user's profile. Maximum 12 reels per page. Includes video URLs, captions, and engagement counts.
  docs: https://docs.konbiniapi.com/reference/mcp/tools/instagram/get-user-reels
- name: instagram_get_user_tagged
  platform: Instagram
  rest: GET /v1/instagram/users/{username}/tagged
  result_type: Collection tool
  description: Returns Instagram posts where the user has been tagged by other accounts. Maximum 12 posts per page. Includes full post details and engagement counts.
  docs: https://docs.konbiniapi.com/reference/mcp/tools/instagram/get-user-tagged
- name: instagram_search_media
  platform: Instagram
  rest: GET /v1/instagram/search
  result_type: Collection tool
  description: Searches Instagram for trending reels and videos matching a keyword. Maximum 24 results per page. Some valid keywords may return no results, since this surfaces trending content rather than a full-text search.
  docs: https://docs.konbiniapi.com/reference/mcp/tools/instagram/search-media
- name: linkedin_get_company
  platform: LinkedIn
  rest: GET /v1/linkedin/companies/{company}
  result_type: Detail tool
  description: Returns public information for a LinkedIn company page including description, location, employee count, and logo.
  docs: https://docs.konbiniapi.com/reference/mcp/tools/linkedin/get-company
- name: linkedin_get_company_posts
  platform: LinkedIn
  rest: GET /v1/linkedin/companies/{company}/posts
  result_type: Collection tool
  description: Returns recent posts from a LinkedIn company page, newest first. Use `cursor` to page through further results.
  docs: https://docs.konbiniapi.com/reference/mcp/tools/linkedin/get-company-posts
- name: linkedin_get_post
  platform: LinkedIn
  rest: GET /v1/linkedin/posts/{postId}
  result_type: Detail tool
  description: Returns a public LinkedIn post including author, engagement counts, and up to ~5 inline comments.
