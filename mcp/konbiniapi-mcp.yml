- name: linkedin_get_post_transcript
  platform: LinkedIn
  rest: GET /v1/linkedin/posts/{postId}/transcript
  result_type: Detail tool
  description: Returns the caption/transcript for a video post, when the post carries captions. Returns 404 if the post has no video or no captions.
